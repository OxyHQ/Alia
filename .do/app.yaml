# DigitalOcean App Platform spec for alia-production
# NOTE: The actual deployment is managed via DO dashboard.
# This file serves as documentation and reference.
# Actual app name: alia-production | App ID: 47f815eb-e095-44c9-a0a4-c315307dac22
#
# STALE, and knowingly so: api.alia.onl resolves to the AWS ALB and the pipeline
# is .github/workflows/deploy-aws.yml. Whether to delete this file or keep it as
# a historical record is the open question in docs/deployment.md.
#
# The `db-oxy` MongoDB cluster and the MONGODB_URI / CA_CERT it fed are gone
# rather than merely stale: the shared instance was archived and destroyed on
# 2026-08-10 and packages/api reads neither variable. No PostgreSQL resource is
# declared in their place — this spec never had one, and inventing one here would
# describe infrastructure that does not exist.
name: alia-production
region: ams

services:
  - name: alia
    github:
      repo: Alia-onl/Alia
      branch: main
      deploy_on_push: true

    build_command: >-
      ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      bun run build:api
    run_command: bun run start:api
    source_dir: /
    environment_slug: node-js
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 2

    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    http_port: 8080

    envs:
      - key: REDIS_URL
        value: "${db-valkey.DATABASE_URL}"
      - key: REDIS_CA_CERT
        value: "${db-valkey.CA_CERT}"
      - key: SERVICE_SECRET
        type: SECRET
      - key: WEB_URL
        value: "https://alia.onl"
      # S3/Spaces
      - key: AWS_REGION
        value: "ams3"
      - key: AWS_ACCESS_KEY_ID
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        type: SECRET
      - key: AWS_ENDPOINT_URL
        value: "https://ams3.digitaloceanspaces.com"
      - key: AWS_S3_BUCKET
        value: "bucket-alia"
      # Stripe
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        type: SECRET
      # LiveKit
      - key: LIVEKIT_URL
        value: "wss://livekit.oxy.so"
      - key: LIVEKIT_API_KEY
        type: SECRET
      - key: LIVEKIT_API_SECRET
        type: SECRET
      - key: LIVEKIT_INTERNAL_URL
        value: "wss://livekit.oxy.so"

  - name: alia-console
    github:
      repo: Alia-onl/Alia
      branch: main
      deploy_on_push: true
    build_command: >-
      ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      bun run build:admin
    run_command: bun run start:admin
    source_dir: /
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080

  - name: integrations
    github:
      repo: Alia-onl/Alia
      branch: main
      deploy_on_push: true
    dockerfile_path: packages/integrations/Dockerfile
    source_dir: /
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 120
      period_seconds: 15
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 10
      port: 3005
    internal_ports:
      - 3005

  - name: alia-canvas
    github:
      repo: Alia-onl/Alia
      branch: main
      deploy_on_push: true
    build_command: >-
      ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      bun run build:canvas
    run_command: bun run start:canvas
    source_dir: /
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3002

static_sites:
  - name: alia-apps-app
    github:
      repo: Alia-onl/Alia
      branch: main
      deploy_on_push: true
    build_command: >-
      ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      bun run build:app
    source_dir: /
    environment_slug: node-js
    output_dir: packages/app/dist
    catchall_document: index.html

databases:
  - name: db-valkey
    engine: REDIS
    version: "7"
    production: true
    cluster_name: db-valkey-ams3-04785

domains:
  - domain: alia.onl
    type: PRIMARY
    zone: alia.onl
  - domain: api.alia.onl
    type: ALIAS
    zone: alia.onl
  - domain: console.alia.onl
    type: ALIAS
    zone: alia.onl
  - domain: canvas.alia.onl
    type: ALIAS
    zone: alia.onl

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: DEPLOYMENT_LIVE
