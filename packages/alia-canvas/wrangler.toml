# Canvas is a Worker, not a Pages project, for one reason: a Pages project
# ALWAYS serves `<project>.pages.dev` and Cloudflare offers no way to switch it
# off — `wrangler pages project` has only `list`, `create` and `delete`. That
# left a second, fully working copy of Canvas at a URL nobody chose, and the
# best Pages could do was redirect it.
#
# A Worker can decline its default hostname outright. With `workers_dev = false`
# the ONLY name that reaches this deployment is the custom domain below.
# Verified against wrangler 4.125.0 with a `--dry-run`, and control-verified:
# the same run flags an invented top-level key as "Unexpected fields", so the
# silence on `workers_dev` and `not_found_handling` means they are recognised
# rather than ignored.
name = "alia-canvas"
compatibility_date = "2026-08-24"

# The whole point.
workers_dev = false

# Static assets with no `main`: there is no Worker script, so every request is
# served straight from the uploaded directory. This replaces BOTH Pages-only
# files the project used to carry — `public/_redirects` (`/* /index.html 200`)
# and the `public/_worker.js` that had to re-implement it once `_worker.js`
# took over routing.
[assets]
directory = "./dist"
# The SPA fallback, as a first-class setting rather than a catch-all rule: a
# request that matches no asset gets `index.html`.
#
# I claimed, in the commit that introduced this file, that it answers
# NAVIGATIONS only and that a missing asset would therefore 404 honestly. That
# is FALSE, and it is corrected here rather than left standing. Measured against
# the deployed Worker with a path that had never existed:
#
#   GET /assets/nope-<nonce>.js  ->  200, content-type: text/html, the app shell
#
# So this behaves exactly like the `/*  /index.html  200` it replaced: EVERY
# miss gets the shell, including a script. That is a wart — a `<script>` tag
# receiving HTML fails in a confusing way — but it is the wart that shipped
# before, so nothing regressed. Changing it is a routing decision on its own
# merits, not something to slip into a hostname migration.
not_found_handling = "single-page-application"

# The only way in.
[[routes]]
pattern = "canvas.alia.onl"
custom_domain = true
