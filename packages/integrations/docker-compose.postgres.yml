# Local Postgres for the integrations test suite.
#
# Plain `postgres:17-alpine`: this schema needs no PostGIS, no pgvector and no
# pg_trgm. Port 5437 rather than 5432 so it cannot collide with a system
# Postgres or with a sibling Oxy service's compose file on the same machine.
#
#   docker compose -f docker-compose.postgres.yml up -d
#   TEST_DATABASE_URL=postgres://alia:alia@127.0.0.1:5437/postgres bun run test
services:
  postgres:
    image: postgres:17-alpine
    container_name: alia-integrations-postgres
    environment:
      POSTGRES_USER: alia
      POSTGRES_PASSWORD: alia
      # The suite creates its own throwaway database per run; this is only the
      # maintenance database it connects to in order to do that.
      POSTGRES_DB: postgres
    ports:
      - '5437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alia -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      # Throwaway by design — no volume, so a stale local database cannot
      # silently outlive the schema that created it.
      - /var/lib/postgresql/data
