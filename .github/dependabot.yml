version: 2

updates:
  # Bun workspaces (bun.lock). Dependabot's npm updater refuses a directory with
  # only a bun.lock, so this is the `bun` ecosystem.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    groups:
      # First-party SDKs get their own PR and it auto-merges
      # (.github/workflows/automerge-first-party.yml). Keep it the FIRST group.
      oxy-platform:
        patterns:
          - "@oxy.so/*"
          - "@alia.onl/*"
          - "@clarity.surf/*"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
