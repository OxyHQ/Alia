# Deploy the integrations service.
#
# A SECOND image out of this repository, not a second tag on `oxy/alia`: this one
# carries Chromium for Playwright, a headless JRE for signal-cli and node-pty,
# none of which the API image has any use for.
#
# It exists because `packages/integrations` had no deploy path at all. The
# consequence, on the running `oxy-alia:114` revision, is that
# `packages/api/src/lib/tools/mcp.ts:48` gates hosted MCP on `INTEGRATIONS_URL &&
# INTEGRATIONS_SECRET`, neither is set, and `buildMcpTools` returns an empty tool
# set without logging — so the connector registry, `POST /mcp/install` and the
# whole SDK-native OAuth flow are silently inert. Local MCP is NOT affected: that
# runs over the API's own WebSocket bridge in `lib/mcp-relay.ts`.
#
# Deliberately separate from `deploy-aws.yml` rather than a second job inside it:
# the two build different images against different Dockerfiles, migrate DIFFERENT
# databases, and must not serialise against each other. See `concurrency` below.
name: Deploy integrations

on:
  # After CI passes on a push to main, never alongside it — the same trigger and
  # guards as deploy-aws.yml, owned by the `scope` job below.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The escape hatch for a path scope that turns out wrong. Releases main's head,
  # and only once CI succeeded for it.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  # The ECS service, the ECR repository and the task-definition family. NOT the
  # package name (`integrations`) and NOT the database name (`alia_integrations`,
  # with an underscore, because an unquoted PostgreSQL identifier cannot contain
  # a hyphen). Three names for three namespaces; none is derivable from another.
  APP: alia-integrations
  CLUSTER: oxy-cluster
  MIGRATION_DATABASE: alia_integrations
  # The commit under release; see the same variable in deploy-aws.yml.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    needs: scope
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.integrations == 'true'
    # On the job, not the workflow: see the same block in deploy-aws.yml. Only a
    # run `scope` judged to be main's head enters the lane, so an older commit
    # whose CI finished last cannot displace a newer pending release.
    concurrency:
      # Its OWN group, not `deploy-alia-backend`. Sharing the API's group would make
      # an integrations change block an API release and vice versa, for no gain: they
      # register revisions on different task-definition families, update different
      # services, and migrate different databases.
      #
      # `cancel-in-progress: false` for the same reason the API deploy has it, and it
      # is load-bearing here too: `runMigrations` takes NO lock — it reads the
      # ledger's high-water mark outside its transaction — so this group is the only
      # interlock stopping two runners attempting the same DDL. Cancelling between
      # `run-task` and its exit-code check would also orphan a live migration task.
      group: deploy-alia-integrations
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    # A backstop against GitHub's 6-hour default, deliberately loose. It must sit
    # ABOVE deploy-ecs-image.sh's own ceiling: MAX_WAIT_SECS (1200s) bounds each
    # wait, and with RUN_MIGRATIONS plus a post-rollout command the longest chain
    # is four of them (pre migration, rollout, post migration, rollback) = 80 min.
    # The rest — this image's ARM64 build included — measured 5-15 minutes a run.
    # Killing the job inside those 80 minutes would strand an unmonitored rollout.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets are NOT in GitHub, and nothing in this workflow writes
      # one. This service reads three SSM parameters, each with one owner:
      # `/oxy/alia-integrations/DATABASE_URL` (written by hand at provisioning,
      # oxy-infra runbook 30), and the API's `/oxy/alia/INTEGRATIONS_SECRET` and
      # `/oxy/alia/TOKEN_ENCRYPTION_KEY`, shared with the API by binding the SAME
      # parameter so a rotation cannot leave the two services disagreeing. Set
      # or rotate with `aws ssm put-parameter --overwrite` (oxy-infra
      # docs/runbooks/46-app-secrets-in-ssm.md). Until 2026-10-10 a step here
      # copied the TOKEN_ENCRYPTION_KEY repo secret into SSM on every deploy.
      - name: Verify SSM-owned runtime secret metadata
        run: |
          for parameter_name in \
            /oxy/alia-integrations/DATABASE_URL \
            /oxy/alia/INTEGRATIONS_SECRET
          do
            # GetParameter is IAM-scoped to these exact two ARNs. Decryption is
            # explicitly disabled and the query emits only name and type.
            metadata="$(aws ssm get-parameter \
              --name "$parameter_name" \
              --no-with-decryption \
              --query 'Parameter.[Name,Type]' \
              --output text)" || metadata=''
            read -r actual_name actual_type <<<"$metadata"
            if [ "$actual_name" != "$parameter_name" ] || [ "$actual_type" != "SecureString" ]; then
              echo "::error::required SecureString metadata is absent for $parameter_name"
              exit 1
            fi
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, Deploy Script
      # Tests), so a change that would stop here fails before it can merge.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe alia-integrations

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ env.RELEASE_SHA }}
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
          TARGET: ${{ steps.reviewed.outputs.target }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # Keep the provenance-bearing OCI index under both tags, but deploy
          # the validated linux/arm64 child manifest. This read-only readiness
          # barrier closes the registry propagation race before any ECS task is
          # launched.
          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            ${TARGET:+--target "$TARGET"} \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$CONTEXT"

          # `:latest` is moved but nothing that deploys reads it. It exists so a
          # from-scratch `terraform apply` — whose task definition declares
          # `<repo>:latest` as its bootstrap image — creates the service on a
          # current build rather than failing to find one.
          INDEX_DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image index digest (got: ${INDEX_DIGEST:-<empty>})"
            exit 1
          fi
          RUNTIME_DIGEST="$(
            IMAGE_REPOSITORY="$IMG" \
            INDEX_DIGEST="$INDEX_DIGEST" \
            bash .github/scripts/resolve-ecr-platform-digest.sh
          )"
          echo "index_digest=$INDEX_DIGEST" >>"$GITHUB_OUTPUT"
          echo "digest=$RUNTIME_DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> index $INDEX_DIGEST -> linux/arm64 $RUNTIME_DIGEST"

      # Does this release carry a post-rollout migration?
      #
      # Grepped with the pattern `@oxy.so/db` EXPORTS as `POST_PHASE_GREP_PATTERN`,
      # never a retyped copy — `packages/integrations/src/db/__tests__/deployWiring.test.ts`
      # asserts this workflow contains that exact string, so the two cannot drift.
      #
      # It resolves FALSE today: the package's single migration is `pre`. That is
      # exactly why the step is here rather than added later. The API's equivalent
      # comment claimed for months that its journal was all `pre` and the step
      # therefore inert; that stopped being true the day `0016` landed, was
      # corrected by nothing, and the deploys it governed were failing meanwhile.
      # A step wired now and inert costs one grep; a step added the day it is
      # first needed is a `post` migration applied by nothing at all.
      #
      # There is no seeder counterpart to the API's — this package has none — so
      # with no post-phase file the output is EMPTY, and `deploy-ecs-image.sh`
      # skips the one-shot entirely rather than running an empty command.
      - name: Build the post-rollout command
        id: phases
        run: |
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/integrations/drizzle >/dev/null 2>&1; then
            CMD="$(jq -cn \
              --arg target "--target-database=$MIGRATION_DATABASE" \
              '["node","packages/integrations/dist/db/migrate.js",$target,"--phase=post"]')"
            echo "this release carries at least one post-rollout migration"
          else
            CMD=''
            echo "no post-rollout migration in this release"
          fi
          printf 'post_command=%s\n' "$CMD" >>"$GITHUB_OUTPUT"

      # Migrations run BEFORE the rollout, on the NEW task definition, as a
      # one-shot task; a non-zero exit fails the deploy with the task's
      # CloudWatch logs and `update-service` is never reached.
      #
      # Running it on the NEW revision rather than the service's live one is what
      # makes it correct: this workflow pins an immutable digest, so the live
      # revision is the OLD image and migrating with it would apply the previous
      # release's migration set behind a green deploy.
      #
      # `MIGRATION_ENTRYPOINT` is the reason this service needed a change to
      # `deploy-ecs-image.sh` at all — the migrator path was hardcoded to
      # `packages/api`.
      #
      # `MIGRATION_TARGET_DATABASE` is `alia_integrations`, a SEPARATE database
      # from the API's `alia`, and that is not a preference. @oxy.so/db fixes the
      # ledger at `drizzle.__drizzle_migrations` with no per-service namespacing
      # and applies a migration only when its journal `when` is strictly newer
      # than the newest recorded one. This package's only migration carries
      # `when=1786270502993`; the OLDEST of the API's 28 is `1786313719561`. In
      # one shared database this migrator would find a ledger already past its
      # entry and `planLedgerRun` would refuse the whole run.
      #
      # The guard is what makes that assertion rather than a hope: `--target-database`
      # is checked against `current_database()` as the FIRST statement on the
      # connection, so a `DATABASE_URL` pointing at `alia` fails before any DDL.
      # Without it a migrator aimed at the wrong database does not fail — it finds
      # an empty ledger, applies everything, and reports success over a database
      # nobody meant to touch.
      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          RUN_MIGRATIONS: 'true'
          MIGRATION_ENTRYPOINT: packages/integrations/dist/db/migrate.js
          MIGRATION_TARGET_DATABASE: ${{ env.MIGRATION_DATABASE }}
          POST_DEPLOY_TASK_COMMAND_JSON: ${{ steps.phases.outputs.post_command }}
          # This service stops holding an Oxy service credential too, and this is
          # the only thing that makes that happen.
          #
          # `alia-integrations` binds `/oxy/alia/OXY_SERVICE_API_KEY` and
          # `..._SECRET` the same way the API did, from a task definition this
          # workflow never wrote: there is no `sync_secret` line and no
          # `TASK_SECRET_OVERRIDES_JSON` here, so the pair is inherited on every
          # revision from oxy-infra's original one. That is precisely why
          # deleting something is not the same as removing it — every release
          # renders from the RUNNING revision, and there is no line here to
          # delete in the first place.
          #
          # `src/platform-activity.ts` is the reader, and it asks whether this
          # process can authenticate rather than whether the pair is present, so
          # the task keeps reporting traffic on the attested role (oxy ADR 0026).
          #
          # Ordering, and it is the same for this lane as for the API's: the
          # `alia-integrations` task role must ALREADY be bound as its Oxy
          # application before this merges. The first deploy after it renders a
          # task definition with no pair, and a service still on the shared role
          # would have no identity at all.
          #
          # No SSM parameter is deleted. This removes the reference.
          TASK_SECRET_REMOVALS_JSON: '["OXY_SERVICE_API_KEY","OXY_SERVICE_API_SECRET"]'
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      # The scope job's base for the next release; see the same step in
      # deploy-aws.yml.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: alia-release-integrations-${{ env.RELEASE_SHA }}

  # The trigger guards, main's head and the path scope, decided outside the
  # release lane (deploy-scope.sh). After `deploy` so that `deploy` stays the
  # first job in the file.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      integrations: ${{ steps.integrations.outputs.integrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
      - name: Release only CI-green main head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # Path-scoped, unlike the API deploy, because this image takes a long ARM64
      # build to produce and almost no commit changes it.
      #
      # The list is derived from what `packages/integrations/Dockerfile` actually
      # COPYs, not from what looks related: the package itself, the root manifest
      # and lockfile, and every workspace `package.json` (the Dockerfile copies all
      # of them so `bun install --filter` can resolve the workspace graph), plus
      # this workflow and the deploy script. The reviewed-image gate's inputs are
      # in it too: the root ignore file is hashed into the pin, and a re-pin or a
      # gate change must reach the guard here. A change outside these cannot alter
      # the image; the cost of this reasoning being wrong is a stale image rather
      # than a bad one, and `workflow_dispatch` is the escape hatch.
      - name: Decide whether anything the integrations image ships changed
        id: integrations
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: '^(packages/integrations/|packages/[^/]+/package\.json$|package\.json$|bun\.lock$|\.github/workflows/deploy-integrations\.yml$|\.github/scripts/deploy-ecs-image\.sh$|\.dockerignore$|\.github/scripts/reviewed-images\.json$|\.github/scripts/reviewed-image\.py$)'
        run: bash .github/scripts/deploy-scope.sh target integrations include "$SCOPE" alia-release-integrations-
