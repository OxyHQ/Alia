name: Deploy Frontends

on:
  # After CI passes on a push to main, never alongside it, with the guards owned
  # by the `scope` job below. Until 2026-10 this ran on `push`, so a commit
  # whose CI went red still shipped its frontends.
  #
  # The API ships from OxyHQ/Gemies since 2026-11-12, and nothing orders the two:
  # a frontend that needs a new API must wait for that API to be live
  # (~/Oxy/docs/infra-and-deploys.md).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases the web app from main's head, and only once CI succeeded for it.
  workflow_dispatch:

# Checkout and the release-marker cache need nothing more: wrangler
# authenticates with the Cloudflare credentials below, never with the job token,
# and the cache is authorised by the Actions runtime rather than by this scope. `scope` adds
# `actions: read` for itself.
permissions:
  contents: read

env:
  # The commit under release: CI's head commit on `workflow_run`, the
  # dispatched commit otherwise.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-app:
    needs: scope
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.app == 'true'
    # One Worker upload at a time; never cancelled mid-upload. On the job, not
    # the workflow, so that only a run `scope` judged to be main's head can
    # queue here and an older commit cannot displace a newer pending release.
    concurrency:
      group: deploy-alia-app
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Measured 3-4 minutes; a backstop against the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          # The one pin is `packageManager` in package.json; scripts/check-bun-pin.mjs
          # holds every setup-bun step to it.
          bun-version-file: package.json
      # --frozen-lockfile: bun.lock is installed verbatim or the step fails.
      # --ignore-scripts: the web builds need no install script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build app
        run: bun run build:app
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off;
      # measured before the
      # migration `alia-app.pages.dev` returned a byte-identical copy of
      # `alia.onl` while being in NEITHER CORS allowlist: it rendered the shell
      # and failed every call it made. `workers_dev = false` in
      # packages/app/wrangler.toml leaves `alia.onl` as the only way in.
      #
      # `bunx wrangler@4`, NOT `cloudflare/wrangler-action` (forbidden
      # fleet-wide). The action installs its own wrangler mid-deploy
      # (`bun i wrangler@3.90.0`), which intermittently dies with
      # `Fail extracting tarball for "wrangler"` and publishes nothing, and it
      # picks its package manager from a lockfile beside `workingDirectory` —
      # there is none in packages/app, so it can fall back to npm, whose
      # resolution nobody has validated. Pinned to a major so a new one cannot change the
      # deploy path with no diff. wrangler reads credentials from `env:`.
      - name: Deploy the Worker
        working-directory: packages/app
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The scope job's base for the next release (deploy-scope.sh `target`).
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: alia-release-app-${{ env.RELEASE_SHA }}

  # The trigger guards, main's head and the web app's path scope, decided
  # outside the release lanes (deploy-scope.sh). The scopes are the ones the
  # `detect-changes` paths-filter used on `push`.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
      - name: Release only CI-green main head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      - name: Decide whether the app changed
        id: app
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh target app include '^(packages/app/|packages/alia-chat/|package\.json$|\.github/workflows/deploy-frontends\.yml$|bun\.lock$)' alia-release-app-
