name: Deploy Frontends

on:
  # After CI passes on a push to main, never alongside it — the same trigger and
  # guards as deploy-aws.yml, owned by the `scope` job below. Until 2026-10 this
  # ran on `push`, so a commit whose CI went red still shipped its frontends.
  #
  # Neither half waits for the other: the frontends are gated on CI, not on the
  # API's rollout, exactly as unordered as they were on `push`. Ship both halves
  # through the pipeline or both by hand (~/Oxy/docs/infra-and-deploys.md).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases both frontends from main's head, and only once CI succeeded for it.
  workflow_dispatch:

# Checkout and the bun cache need nothing more: wrangler authenticates with the
# Cloudflare credentials below, never with the job token, and the cache is
# authorised by the Actions runtime rather than by this scope. `scope` adds
# `actions: read` for itself.
permissions:
  contents: read

env:
  # The commit under release; see the same variable in deploy-aws.yml.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-app:
    needs: scope
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.app == 'true'
    # One Worker upload at a time; never cancelled mid-upload. On the job, not
    # the workflow, so that only a run `scope` judged to be main's head can
    # queue here and an older commit cannot displace a newer pending release.
    concurrency:
      group: deploy-alia-app
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Measured 3-4 minutes; a backstop against the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          # The one pin is `packageManager` in package.json; scripts/check-bun-pin.mjs
          # holds every setup-bun step and Docker image to it.
          bun-version-file: package.json
      # The git dependency `libsignal` is fetched from GitHub unauthenticated and
      # cannot be authenticated; a warm cache is what stops that request being
      # made. See the comment at the top of ci.yml for the measurement, and
      # .github/scripts/check-bun-cache-wiring.mjs, which fails if this is removed.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # --frozen-lockfile: bun.lock is installed verbatim or the step fails.
      # --ignore-scripts skips electron/playwright/node-pty postinstalls
      # (alia-cowork) that hang deploys.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build app
        run: bun run build:app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
      # A WORKER, not a Pages project — same reason as canvas below. A Pages
      # project always serves `<project>.pages.dev`, and measured before the
      # migration `alia-app.pages.dev` returned a byte-identical copy of
      # `alia.onl` while being in NEITHER CORS allowlist: it rendered the shell
      # and failed every call it made. `workers_dev = false` in
      # packages/app/wrangler.toml leaves `alia.onl` as the only way in.
      #
      # `bunx wrangler@4`, NOT `cloudflare/wrangler-action` (forbidden
      # fleet-wide). The action installs its own wrangler mid-deploy
      # (`bun i wrangler@3.90.0`), which intermittently dies with
      # `Fail extracting tarball for "wrangler"` and publishes nothing, and it
      # picks its package manager from a lockfile beside `workingDirectory` —
      # there is none in packages/app, so it can fall back to npm, which is what
      # broke Canvas below. Pinned to a major so a new one cannot change the
      # deploy path with no diff. wrangler reads credentials from `env:`.
      # Publish immutable revisions before switching the web deployment. Old native
      # binaries keep their pinned URL; this upload never deletes or overwrites.
      - name: Publish avatar runtime release
        run: node packages/app/scripts/publish-avatar-runtime.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AVATAR_R2_ACCESS_KEY_ID: ${{ secrets.AVATAR_R2_ACCESS_KEY_ID }}
          AVATAR_R2_SECRET_ACCESS_KEY: ${{ secrets.AVATAR_R2_SECRET_ACCESS_KEY }}
      - name: Deploy the Worker
        working-directory: packages/app
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The scope job's base for the next release; see the same step in
      # deploy-aws.yml.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: alia-release-app-${{ env.RELEASE_SHA }}

  deploy-canvas:
    needs: scope
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.canvas == 'true'
    # One Worker upload at a time; never cancelled mid-upload. On the job, not
    # the workflow, so that only a run `scope` judged to be main's head can
    # queue here and an older commit cannot displace a newer pending release.
    concurrency:
      group: deploy-alia-canvas
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Measured 3-4 minutes; a backstop against the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          # The one pin is `packageManager` in package.json; scripts/check-bun-pin.mjs
          # holds every setup-bun step and Docker image to it.
          bun-version-file: package.json
      # The git dependency `libsignal` is fetched from GitHub unauthenticated and
      # cannot be authenticated; a warm cache is what stops that request being
      # made. See the comment at the top of ci.yml for the measurement, and
      # .github/scripts/check-bun-cache-wiring.mjs, which fails if this is removed.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # --frozen-lockfile: bun.lock is installed verbatim or the step fails.
      # --ignore-scripts skips electron/playwright/node-pty postinstalls
      # (alia-cowork) that hang deploys.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build canvas
        run: bun run build:canvas
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_ENV: production
          VITE_API_URL: https://api.alia.onl
      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off, so
      # Canvas had a second working copy at a URL nobody chose. A Worker declines
      # its default hostname (`workers_dev = false` in
      # packages/alia-canvas/wrangler.toml), leaving `canvas.alia.onl` as the only
      # name that reaches it. Everything else — the assets directory, the SPA
      # fallback, the custom domain — is declared in that file rather than passed
      # here, so a deploy cannot disagree with the config.
      #
      # DEPLOYED WITH THE REPOSITORY'S OWN WRANGLER, run by bun. This was
      # `cloudflare/wrangler-action@v3`, and it failed on every run from the
      # commit that introduced it onwards — five real runs, five failures. The
      # action installs its own wrangler first, choosing the package manager by
      # looking for a lockfile in its `workingDirectory`; `packages/alia-canvas`
      # has none, because the lockfile is at the repository root, so it fell
      # back to npm. npm resolves the whole package, and cannot: Canvas takes
      # `react-native-gesture-handler` for `react-native-web` and never depends
      # on `react-native`, so that library's `peer react-native@"*"` is
      # unsatisfiable and the install exits ERESOLVE.
      #
      # `deploy-app` above was the control: same action, run where it found the
      # root `bun.lock`, so it picked bun and worked. It also showed what the
      # action does when it works — `bun i wrangler@3.90.0`, which prints
      # "Saved lockfile". The tool that deploys should be declared and pinned by
      # us, not installed into the working tree mid-deploy; `deploy-app` now
      # calls `bunx wrangler@4` directly for the same reason.
      #
      # `--legacy-peer-deps` would also have made the npm install succeed, and
      # is exactly the wrong fix: it ships a dependency resolution nobody has
      # validated. The anomaly is npm being in the path at all.
      #
      # wrangler takes its credentials from the environment (Wrangler's system
      # environment variables), which is why they are `env:` rather than
      # arguments. The emptiness check is not paranoia: an organisation secret
      # scoped to public repositories reaches a private one as an EMPTY STRING
      # with no error of its own.
      - name: Deploy the Worker
        working-directory: packages/alia-canvas
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The scope job's base for the next release; see the same step in
      # deploy-aws.yml.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: alia-release-canvas-${{ env.RELEASE_SHA }}

  # The trigger guards, main's head and each frontend's path scope, decided
  # outside the release lanes (deploy-scope.sh). The scopes are the ones the
  # `detect-changes` paths-filter used on `push`.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.app.outputs.app }}
      canvas: ${{ steps.canvas.outputs.canvas }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
      - name: Release only CI-green main head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      - name: Decide whether the app changed
        id: app
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh target app include '^(packages/app/|packages/alia-chat/|package\.json$|\.github/workflows/deploy-frontends\.yml$|bun\.lock$)' alia-release-app-
      - name: Decide whether Canvas changed
        id: canvas
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh target canvas include '^(packages/alia-canvas/|bun\.lock$)' alia-release-canvas-
