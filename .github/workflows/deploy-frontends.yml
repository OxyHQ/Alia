name: Deploy Frontends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-frontends.yml'
      - 'packages/app/**'
      - 'packages/alia-chat/**'
      - 'packages/alia-canvas/**'
      - 'bun.lock'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
      canvas: ${{ steps.changes.outputs.canvas }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - 'packages/app/**'
              - 'packages/alia-chat/**'
              - 'bun.lock'
            canvas:
              - 'packages/alia-canvas/**'
              - 'bun.lock'

  deploy-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The git dependency `libsignal` is fetched from GitHub unauthenticated and
      # cannot be authenticated; a warm cache is what stops that request being
      # made. See the comment at the top of ci.yml for the measurement, and
      # .github/scripts/check-bun-cache-wiring.mjs, which fails if this is removed.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo, so we
      # assert lockfile stability via `git diff --exit-code bun.lock`. --ignore-scripts
      # skips electron/playwright/node-pty postinstalls (alia-cowork) that hang deploys.
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          git diff --exit-code bun.lock
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build app
        run: bun run build:app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/app/dist --project-name=alia-app --branch=main

  deploy-canvas:
    needs: detect-changes
    if: needs.detect-changes.outputs.canvas == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The git dependency `libsignal` is fetched from GitHub unauthenticated and
      # cannot be authenticated; a warm cache is what stops that request being
      # made. See the comment at the top of ci.yml for the measurement, and
      # .github/scripts/check-bun-cache-wiring.mjs, which fails if this is removed.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo, so we
      # assert lockfile stability via `git diff --exit-code bun.lock`. --ignore-scripts
      # skips electron/playwright/node-pty postinstalls (alia-cowork) that hang deploys.
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          git diff --exit-code bun.lock
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build canvas
        run: bun run build:canvas
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_ENV: production
          VITE_API_URL: https://api.alia.onl
      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off, so
      # Canvas had a second working copy at a URL nobody chose. A Worker declines
      # its default hostname (`workers_dev = false` in
      # packages/alia-canvas/wrangler.toml), leaving `canvas.alia.onl` as the only
      # name that reaches it. Everything else — the assets directory, the SPA
      # fallback, the custom domain — is declared in that file rather than passed
      # here, so a deploy cannot disagree with the config.
      #
      # DEPLOYED WITH THE REPOSITORY'S OWN WRANGLER, run by bun. This was
      # `cloudflare/wrangler-action@v3`, and it failed on every run from the
      # commit that introduced it onwards — five real runs, five failures. The
      # action installs its own wrangler first, choosing the package manager by
      # looking for a lockfile in its `workingDirectory`; `packages/alia-canvas`
      # has none, because the lockfile is at the repository root, so it fell
      # back to npm. npm resolves the whole package, and cannot: Canvas takes
      # `react-native-gesture-handler` for `react-native-web` and never depends
      # on `react-native`, so that library's `peer react-native@"*"` is
      # unsatisfiable and the install exits ERESOLVE.
      #
      # `deploy-app` above is the control: same action, no `workingDirectory`,
      # so it finds the root `bun.lock`, picks bun, and works. It also shows
      # what the action does when it works — `bun i wrangler@3.90.0`, which
      # prints "Saved lockfile". The tool that deploys should be declared and
      # pinned by us, not installed into the working tree mid-deploy.
      #
      # `--legacy-peer-deps` would also have made the npm install succeed, and
      # is exactly the wrong fix: it ships a dependency resolution nobody has
      # validated. The anomaly is npm being in the path at all.
      #
      # wrangler takes its credentials from the environment (Wrangler's system
      # environment variables), which is why they are `env:` rather than
      # arguments. The emptiness check is not paranoia: an organisation secret
      # scoped to public repositories reaches a private one as an EMPTY STRING
      # with no error of its own, and `bind-pages-domain.yml` carries the same
      # guard for the same reason.
      - name: Deploy the Worker
        working-directory: packages/alia-canvas
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
