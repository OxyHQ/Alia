name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch supersedes the last one. A push to `main` does not.
#
# ## What was wrong, and how it presented
#
# This was `group: <workflow>-<ref>` with `cancel-in-progress: true` for every
# ref, so every merge to `main` killed the run of the merge before it. On
# 2026-08-17, with merges landing minutes apart, `API (Postgres)`, `Build API`
# and `Integrations (Postgres)` were CANCELLED on consecutive `main` commits —
# the real-database suite did not complete a single run on `main` for hours.
# `Lint & Test` survived only because it finishes fastest.
#
# A cancelled check is the worst possible failure of a gate: it is in the check
# list, it is not red, and it never ran. Two merges are not two attempts at one
# thing — they are different commits, and cancelling the earlier one destroys
# the only post-merge evidence that commit will ever have.
#
# ## Why the GROUP does the work and the flag is only a backstop
#
# Setting `cancel-in-progress: false` for `main` is NOT sufficient, and this is
# the part that is easy to get wrong. GitHub's own documentation: *"When a
# concurrent job or workflow is queued, if another job or workflow using the
# same concurrency group in the repository is in progress, the queued job or
# workflow will be `pending`. By default, any existing `pending` job or workflow
# in the same concurrency group will be canceled and the new queued job or
# workflow will take its place."* `cancel-in-progress` is scoped to runs that
# are *currently running*; it says nothing about pending ones. So with a shared
# group, three merges in quick succession still lose the middle one — it is
# cancelled while pending, not while running.
#
# Giving each `main` commit its own group is what fixes that: nothing shares a
# group, so there is nothing to supersede, running or pending. The flag stays
# ref-conditional as a backstop for any future event that lands two runs on one
# `main` SHA.
#
# ## What was verified against GitHub's documentation, and what was not
#
#  - `cancel-in-progress` accepting an EXPRESSION is documented, with a worked
#    example whose stated behaviour differs per branch — which is only possible
#    if the expression is evaluated rather than coerced to a truthy string. The
#    type `boolean` is declared in GitHub's workflow-parser schema. VERIFIED.
#  - A pending run being cancelled when a newer one joins the group: documented,
#    quoted above. VERIFIED.
#  - That this happens *regardless of* `cancel-in-progress`: strongly implied by
#    that flag's wording ("currently running") and by the default `queue:
#    single` description, but not stated in those words. INFERRED — and the
#    per-commit group makes it moot either way, which is why the fix does not
#    rest on it.
#  - `github.sha` inside a concurrency group is not a documented pattern.
#    GitHub's documented answer to "let runs queue instead of being cancelled"
#    is `queue: max`, and it CANNOT be used here: the docs state that
#    `queue: max` with `cancel-in-progress: true` is a workflow validation
#    error, and this workflow needs `true` on PR branches. So the group carries
#    the commit instead. `github.run_id` is the documented unique value, but it
#    is unique per RUN rather than per COMMIT, which would also break the PR
#    branch behaviour this keeps.
#
# `deploy-aws.yml` is deliberately untouched: it serialises production rollouts
# on one group with `cancel-in-progress: false`, which is a different and
# correct requirement. `.github/scripts/check-workflow-concurrency.mjs` asserts
# both this and that, so neither can drift into the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege for the token Actions injects into every runner.
#
# Nothing here sets `GITHUB_TOKEN` deliberately — the git-dependency fetch
# described below cannot be authenticated, which is why the fix is the cache —
# but Actions provides one to every job regardless, and `actions/checkout`
# persists it into `.git/config` by default. `bun install` then runs lifecycle
# scripts for ~2,861 packages in that same environment, so the DEFAULT
# repository scope is a repo-scoped write credential reachable by every
# postinstall in the tree.
#
# `contents: read` is sufficient, and that was verified rather than assumed:
# every job in this workflow uses only `actions/checkout`, `actions/cache`,
# `actions/setup-node` and `oven-sh/setup-bun`. Nothing pushes, comments, opens
# a release or calls `gh`. `actions/cache` is authorised by the cache service
# rather than by this scope, so restore and save are unaffected.
#
# `deploy-frontends.yml` deliberately does NOT get one from this change: it
# deploys and consumes secrets, so scoping it down needs its own verification.
permissions:
  contents: read

# `bun install` fetches a GIT dependency, and that fetch CANNOT be authenticated.
#
# `@whiskeysockets/baileys` (packages/integrations) declares `libsignal` as
# `git+https://github.com/whiskeysockets/libsignal-node.git`. It is not on npm,
# so bun downloads a tarball from GitHub. Measured 2026-08-17: every job in a
# run failed at "Install dependencies" with
# `api.github.com/.../tarball/bcea72d - 504`, then
# `codeload.github.com/.../legacy.tar.gz/bcea72d - 429`, before any repository
# code ran. Anonymous GitHub requests are limited per IP and shared with every
# other runner on that address.
#
# THREE LEVERS LOOK LIKE THE FIX AND ALL THREE ARE INERT. Do not reach for them:
#
#   * `GITHUB_TOKEN` in the environment. `bun install --verbose` prints request
#     headers, and the `codeload.github.com` request carries only Connection,
#     User-Agent, Accept, Host and Accept-Encoding — no Authorization — with the
#     variable set. The positive control is in the same output: every
#     `registry.npmjs.org` request DOES print `Authorization: Bearer …`, so the
#     printer prints the header when it exists.
#   * The `bun --help` line "Supply a token to download code from GitHub with a
#     higher rate limit" is real, and it is inside the `bun create` block.
#     `bun install --help` does not mention `GITHUB_TOKEN` at all.
#   * `GITHUB_API_DOMAIN`, same block, same story. `git config
#     url."…".insteadOf` likewise: bun fetches with its own HTTP client rather
#     than shelling out to git, which is why the failures are `GET` lines
#     naming codeload rather than a git error.
#
# So the request cannot be made to survive rate limiting. It can only be made
# not to happen — which is what the cache below does. With `bun.lock` present
# the git ref is already pinned, so a warm cache satisfies the dependency with
# ZERO GitHub requests.
#
# LIMIT, stated because a cache reads like a fix: a cache MISS still fetches,
# unauthenticated, and can still be rate-limited. The first run after any
# `bun.lock` change is a miss. Eliminating the fetch entirely means vendoring
# the dependency or hosting our own tarball, which is a lockfile change.

jobs:
  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-resolve-ecr-platform-digest.sh

      # `check-static-assets.mjs` runs in `Frontend Typecheck` and goes green
      # when the tree is sound — which is indistinguishable from going green
      # because it stopped looking. Its FIRST version did exactly that: a
      # `grep -E` backreference matched nothing and it reported a clean sweep
      # over five real references. This points it at trees built to be broken
      # and requires it to say so, so its ability to fail is gated too. Runs
      # here because this job installs nothing and needs no workspace.
      - name: Verify the static-asset gate can still fail
        run: node .github/scripts/test-check-static-assets.mjs

      # The Cloudflare cutover scripts mutate production DNS and delete a Pages
      # project, from a workflow whose inputs are a hostname and a project name.
      # On 2026-08-26 they cost `alia.onl` fifteen minutes of downtime and its
      # SPF record, to a query that filters by name and not by type — and the
      # recovery run that destroyed the SPF record reported success. Nothing
      # about a green run distinguished it, so the scripts are gated against
      # fixtures shaped like the apex that provoked it, controls included.
      # Here because this job installs nothing and needs no workspace.
      - name: Verify the Cloudflare cutover scripts can still fail
        run: bash .github/scripts/test-cloudflare-cutover.sh

      # The same incident, asserted statically. The harness above proves the
      # scripts behave on fixtures shaped like the apex; this forbids the SHAPE
      # that caused it — indexing `.result[0]` into a record list a query never
      # narrowed — anywhere in the workflows or the scripts they call. Both
      # halves are needed: a behavioural fixture cannot see a new caller written
      # tomorrow, and a static shape cannot see whether the logic is right.
      - name: Verify no DNS write indexes into a list it did not narrow
        run: node .github/scripts/check-dns-record-filters.mjs

      - name: Verify that gate can still fail
        run: node .github/scripts/test-check-dns-record-filters.mjs

      # Runs in the one job that installs nothing, so it reports before the jobs
      # it protects would fail. See the header comment: the cache is the only
      # thing stopping an unauthenticatable GitHub fetch on every install.
      - name: Verify bun cache wiring
        run: node .github/scripts/check-bun-cache-wiring.mjs

      # Same job, same reason: it installs nothing, so it reports before the
      # jobs it protects would be cancelled. A cancelled check is in the check
      # list, is not red, and never ran.
      - name: Verify workflow concurrency
        run: node .github/scripts/check-workflow-concurrency.mjs

      # Same job, same reason. The Canvas Worker deploy is a post-merge job that
      # a paths-filter skips on most pushes, so "is Deploy Frontends green"
      # answers the same whether or not it works — it failed five consecutive
      # real runs unnoticed. This asserts the wiring; the step below in
      # `Frontend Typecheck` exercises the behaviour.
      - name: Verify the Canvas deploy is wired to a declared wrangler
        run: node .github/scripts/check-canvas-deploy-wiring.mjs

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history, because `lib/security/__tests__/credential-scan.test.ts`
      # scans every blob reachable from HEAD for provider credentials. The
      # default depth is 1, and a one-commit scan of this repository finds none
      # of the four disclosures the full one does — a clean result for the wrong
      # reason. `scanGitHistory` REFUSES a shallow clone rather than returning an
      # empty list, so removing this line turns the job red instead of turning
      # the check off.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo,
      # so we assert lockfile stability via `git diff --exit-code bun.lock` instead.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Lint API
        run: bun run --filter @alia/api lint

      - name: Typecheck API
        run: bun run --filter @alia/api typecheck

      - name: Run API tests
        run: bun run --filter @alia/api test

      - name: Typecheck SDK
        run: bun run --filter @alia.onl/sdk typecheck

      - name: Test SDK streaming contract
        run: bun run --filter @alia.onl/sdk test

      # @alia.onl/sdk ships raw source, so anything the root entry can reach is
      # compiled into every text-chat consumer's bundle. Keeps livekit-client
      # behind the ./voice entry.
      - name: Check SDK entry isolation
        run: bun run --filter @alia.onl/sdk check:entries

  # The frontend packages had no typecheck, no lint and no test script between
  # them, and none of them was referenced by this workflow — so every frontend PR
  # merged on a green that said nothing about it. This is the gate for that.
  #
  # Deliberately NOT `needs: lint-and-test`. A dependent job that never runs
  # reports no conclusion, which reads as "not failing"; keeping this independent
  # means a red API cannot mask a red frontend, and a frontend PR gets its answer
  # without waiting on a suite it does not touch.
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo,
      # so we assert lockfile stability via `git diff --exit-code bun.lock` instead.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # Enumerates the workspaces and requires each to be checked here, checked by
      # a named job elsewhere, explicitly excluded, or explicitly scriptless — so
      # a new package cannot join the repo unnoticed. See the script's header.
      - name: Typecheck workspaces
        run: bun .github/scripts/typecheck-workspaces.ts

      # `@alia/app`'s typecheck runs `expo customize tsconfig.json` first, because
      # `typedRoutes` is inert until `.expo/types/router.d.ts` exists: measured on
      # this tree, a `router.push('/not-a-route')` is a hard error with it and
      # passes clean without it. That command can also rewrite the tsconfig from
      # Expo's template, which would be a silent change to a tracked file — so it
      # is asserted not to have.
      - name: Assert the Expo generator did not rewrite tsconfig
        run: git diff --exit-code packages/app/tsconfig.json

      # `alia-console` gains a `typecheck` script in this PR, so the enumeration
      # above picks it up automatically. Its SUITE does not enumerate: before
      # this PR the package had zero test files and a `test` script of
      # `vitest run --passWithNoTests`, which is a green that measures nothing.
      # The suite is the row-459 gate — it fails if a screen or store starts
      # asking Alia to issue an application or a key again.
      - name: Test console
        run: bun run --filter alia-console test

      # Nitro depends on unstorage, whose broad OPTIONAL peer set leaves a
      # mongodb resolution in bun.lock even though Alia is PostgreSQL-only.
      # Replacing Nitro is outside this cutover; build the actual server and
      # prove the optional driver did not enter its runtime artefact.
      - name: Prove the console runtime contains no Mongo driver
        run: |
          bun run --filter alia-console build
          node scripts/check-no-mongodb-runtime.mjs

      # The VS Code extension parses `GET /catalogue` and `GET /catalogue/modes`
      # itself — it bundles with esbuild and cannot depend on an unpublished
      # workspace package, so the parsing is its own. It had a `test` script and
      # a suite that no job ran, which is a suite that cannot fail.
      - name: Test Codea extension
        run: bun run --filter alia-codea test

      # `@alia/app` has had a `test` script and, until now, no job calling it —
      # the same suite-that-cannot-fail as the two above. The effort selector is
      # its first real subject: the control it renders depends on platform and
      # width, and the haptic tick fires from inside a worklet, so neither is
      # visible to `tsc`. Mutation-verified when it was written — inverting the
      # small-screen gate fails three of the four cases, and deleting the
      # once-per-boundary guard fails exactly the case that names it.
      - name: Test app
        run: bun run --filter @alia/app test

      # The agent thread lives at `app/(app)/[username].tsx`, a dynamic segment
      # at the top of the group — which is what makes `/@pepe` possible and what
      # makes it match every single-segment path no static route claims. Forty
      # routes sit at that level. This resolves each of them through Expo
      # Router's own matcher and fails if the profile has taken one, and it is
      # not a test file because a `__tests__` file under `app/` is itself a
      # ROUTE: `expo-router/_ctx.web.js` excludes exactly `+api`, `+middleware`,
      # `+html` and `+native-intent`, and nothing else.
      - name: Verify no route is swallowed by the agent profile
        run: node scripts/check-single-segment-routes.mjs

      # `require('…/thing.png')` is typed `any`, so `tsc` never resolves it: a
      # source file naming a deleted asset passes every gate here and fails in
      # Metro at runtime. It happened — the agent avatar's PNGs were deleted in
      # one PR and the last `require` of them removed in another, and the safe
      # order was luck. Same defect as `check-dockerfile-workspaces.mjs`, one
      # layer up.
      - name: Verify every static asset a source file names exists
        run: node scripts/check-static-assets.mjs

      # `alia-canvas` and the Codea `webview-ui` are solution-style projects
      # (`"files": []`, references only), so `tsc --noEmit` in them compiles
      # NOTHING and exits 0 — which is why `typecheck-workspaces.ts` lists both
      # as scriptless and points at the `tsc -b` inside their own `build`. That
      # build only ran in `deploy-frontends.yml`, on main, AFTER merge. This is
      # the same check, before it.
      - name: Typecheck the solution-style frontends
        run: |
          bunx tsc -b packages/alia-canvas
          bunx tsc -b packages/alia-codea/webview-ui

      # The Canvas Worker deploy, minus the publish — the same wrangler, the
      # same wrangler.toml and the same build output that `deploy-frontends.yml`
      # ships, run on every pull request instead of only after merge. That
      # timing is the point: the deploy job is behind a paths-filter, so it is
      # SKIPPED on most pushes, and a workflow whose only failing job is skipped
      # reports success.
      #
      # `--dry-run` needs no credentials — it stops before authenticating — and
      # it is not a no-op: it fails if the assets directory is missing and if
      # wrangler does not recognise a key in the config, both verified against
      # wrangler 4.125.0. The build is ~3s.
      - name: Dry-run the Canvas Worker deploy
        run: |
          bun run build:canvas
          bun run --cwd packages/alia-canvas deploy:dry
        env:
          NODE_ENV: production
          VITE_API_URL: https://api.alia.onl

      # Every client reads GET /catalogue instead of baking an `alia-*`
      # identifier into a shipped artefact. It spans nine source trees, and
      # every workspace the repo declares must be either walked by it or
      # classified as shipping no picker — so it is a script rather than any one
      # package's suite.
      - name: Check no client hardcodes a model default
        run: node scripts/check-model-defaults.mjs

      # The image build is the only thing that reads the Dockerfile, and CI does
      # not build the image — `Build API` runs `bun build`. So a COPY naming a
      # deleted workspace leaves every gate green and kills the deploy, which is
      # exactly what happened when `packages/shared-types` was removed.
      - name: Check the Dockerfile copies only workspaces that exist
        run: node scripts/check-dockerfile-workspaces.mjs

      # The picker labels a routing profile with the product's own words —
      # Fast, Balanced, Maximum quality, Coding — rather than the display name
      # of the alias it came from. The server half is gated by
      # architectureGates gate 5; this is the client half, which this script
      # covers as a source scan — `packages/app`'s own suite runs in the
      # frontend job, but it asserts behaviour, not the words on the labels.
      - name: Check the picker speaks the product's language
        run: node scripts/check-picker-language.mjs

      # #139 line 99, a non-negotiable invariant: a routing policy is never
      # PRESENTED as an Alia-owned model. The census above covers the
      # identifiers a request carries; this covers the text a person reads, and
      # they failed independently — a `<Label>Model</Label>`, a Telegram command
      # menu reading "Change AI model" and a CLI printing "Model: Kaana Lite"
      # contain no identifier between them, so nothing turned red for any of
      # the three.
      - name: Check no client tells a person a profile is a model
        run: node scripts/check-user-visible-model-wording.mjs

      # An agent's colour vocabulary is declared twice — the generator's and the
      # editor's — because the API must not depend on `@oxyhq/bloom` and the app
      # does not depend on the API. Nothing held the two together, and the
      # picker shipped offering all 61 Bloom free presets when Oxy's
      # `users_color_check` stores 11: fifty-two swatches that 400 on save, each
      # one rendering perfectly in the picker first.
      #
      # In THIS job because it needs the installed Bloom package, whose real
      # `FREE_COLOR_NAMES` is one of the three lists it crosses.
      - name: Check an agent is offered no colour it cannot keep
        run: node scripts/check-agent-colour-vocabulary.mjs

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo,
      # so we assert lockfile stability via `git diff --exit-code bun.lock` instead.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Build API
        run: bun run build:api

  integrations-postgres:
    name: Integrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    # A REAL Postgres, because the properties this suite asserts — CHECK
    # constraints, unique indexes, ON DELETE CASCADE, ON CONFLICT — are enforced
    # by the server and have no mocked counterpart. A mocked `insert` accepts any
    # statement, including one Postgres rejects outright, which is exactly the
    # class of defect a Mongo port introduces.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alia
          POSTGRES_PASSWORD: alia
          POSTGRES_DB: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U alia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Typecheck integrations
        run: bun run --filter @alia/integrations type-check

      # The suite creates its own throwaway, fully-migrated database per run via
      # the REAL src/db/migrate.ts entrypoint, so this also exercises the phase
      # and --target-database guards.
      - name: Test integrations against Postgres
        env:
          TEST_DATABASE_URL: postgres://alia:alia@127.0.0.1:5437/postgres
        run: bun run --filter @alia/integrations test

  api-postgres:
    name: API (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    # A REAL Postgres, for the same reason the integrations job uses one: CHECK
    # constraints, unique indexes and ON CONFLICT are enforced by the server and
    # have no mocked counterpart. The leader-election CAS in particular is a
    # single conditional statement whose whole behaviour is the server's.
    #
    # Separate from `lint-and-test` rather than folded into it: that job runs the
    # default suite, which needs no database at all, and merging them would make
    # every local `bun run test` require Docker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alia
          POSTGRES_PASSWORD: alia
          POSTGRES_DB: postgres
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U alia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # The suite creates its own throwaway, fully-migrated database per run via
      # the REAL src/db/migrate.ts entrypoint, so this also exercises the phase
      # and --target-database guards an operator depends on.
      - name: Test API against Postgres
        env:
          TEST_DATABASE_URL: postgres://alia:alia@127.0.0.1:5440/postgres
        run: bun run --filter @alia/api test:pg
