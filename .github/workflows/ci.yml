name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history, because `lib/security/__tests__/credential-scan.test.ts`
      # scans every blob reachable from HEAD for provider credentials. The
      # default depth is 1, and a one-commit scan of this repository finds none
      # of the four disclosures the full one does — a clean result for the wrong
      # reason. `scanGitHistory` REFUSES a shallow clone rather than returning an
      # empty list, so removing this line turns the job red instead of turning
      # the check off.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo,
      # so we assert lockfile stability via `git diff --exit-code bun.lock` instead.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Lint API
        run: bun run --filter @alia/api lint

      - name: Typecheck API
        run: bun run --filter @alia/api typecheck

      - name: Run API tests
        run: bun run --filter @alia/api test

      - name: Typecheck SDK
        run: bun run --filter @alia.onl/sdk typecheck

      # @alia.onl/sdk ships raw source, so anything the root entry can reach is
      # compiled into every text-chat consumer's bundle. Keeps livekit-client
      # behind the ./voice entry.
      - name: Check SDK entry isolation
        run: bun run --filter @alia.onl/sdk check:entries

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun 1.3.14's --frozen-lockfile falsely reports drift for this monorepo,
      # so we assert lockfile stability via `git diff --exit-code bun.lock` instead.
      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Build API
        run: bun run build:api

  integrations-postgres:
    name: Integrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    # A REAL Postgres, because the properties this suite asserts — CHECK
    # constraints, unique indexes, ON DELETE CASCADE, ON CONFLICT — are enforced
    # by the server and have no mocked counterpart. A mocked `insert` accepts any
    # statement, including one Postgres rejects outright, which is exactly the
    # class of defect a Mongo port introduces.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alia
          POSTGRES_PASSWORD: alia
          POSTGRES_DB: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U alia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      - name: Typecheck integrations
        run: bun run --filter @alia/integrations type-check

      # The suite creates its own throwaway, fully-migrated database per run via
      # the REAL src/db/migrate.ts entrypoint, so this also exercises the phase
      # and --target-database guards.
      - name: Test integrations against Postgres
        env:
          TEST_DATABASE_URL: postgres://alia:alia@127.0.0.1:5437/postgres
        run: bun run --filter @alia/integrations test

  api-postgres:
    name: API (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    # A REAL Postgres, for the same reason the integrations job uses one: CHECK
    # constraints, unique indexes and ON CONFLICT are enforced by the server and
    # have no mocked counterpart. The leader-election CAS in particular is a
    # single conditional statement whose whole behaviour is the server's.
    #
    # Separate from `lint-and-test` rather than folded into it: that job runs the
    # Mongo suite, which needs no Postgres, and merging them would make every
    # local `bun run test` require Docker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alia
          POSTGRES_PASSWORD: alia
          POSTGRES_DB: postgres
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U alia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code bun.lock

      # The suite creates its own throwaway, fully-migrated database per run via
      # the REAL src/db/migrate.ts entrypoint, so this also exercises the phase
      # and --target-database guards an operator depends on.
      - name: Test API against Postgres
        env:
          TEST_DATABASE_URL: postgres://alia:alia@127.0.0.1:5440/postgres
        run: bun run --filter @alia/api test:pg
