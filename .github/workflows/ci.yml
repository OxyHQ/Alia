name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch supersedes the last one. A push to `main` does not.
#
# ## What was wrong, and how it presented
#
# This was `group: <workflow>-<ref>` with `cancel-in-progress: true` for every
# ref, so every merge to `main` killed the run of the merge before it. On
# 2026-08-17, with merges landing minutes apart, the backend's real-database
# jobs (since moved to OxyHQ/Gemies with the backend) were CANCELLED on
# consecutive `main` commits and did not complete a single run on `main` for
# hours. `Lint & Test` survived only because it finishes fastest.
#
# A cancelled check is the worst possible failure of a gate: it is in the check
# list, it is not red, and it never ran. Two merges are not two attempts at one
# thing — they are different commits, and cancelling the earlier one destroys
# the only post-merge evidence that commit will ever have.
#
# ## Why the GROUP does the work and the flag is only a backstop
#
# Setting `cancel-in-progress: false` for `main` is NOT sufficient, and this is
# the part that is easy to get wrong. GitHub's own documentation: *"When a
# concurrent job or workflow is queued, if another job or workflow using the
# same concurrency group in the repository is in progress, the queued job or
# workflow will be `pending`. By default, any existing `pending` job or workflow
# in the same concurrency group will be canceled and the new queued job or
# workflow will take its place."* `cancel-in-progress` is scoped to runs that
# are *currently running*; it says nothing about pending ones. So with a shared
# group, three merges in quick succession still lose the middle one — it is
# cancelled while pending, not while running.
#
# Giving each `main` commit its own group is what fixes that: nothing shares a
# group, so there is nothing to supersede, running or pending. The flag stays
# ref-conditional as a backstop for any future event that lands two runs on one
# `main` SHA.
#
# ## What was verified against GitHub's documentation, and what was not
#
#  - `cancel-in-progress` accepting an EXPRESSION is documented, with a worked
#    example whose stated behaviour differs per branch — which is only possible
#    if the expression is evaluated rather than coerced to a truthy string. The
#    type `boolean` is declared in GitHub's workflow-parser schema. VERIFIED.
#  - A pending run being cancelled when a newer one joins the group: documented,
#    quoted above. VERIFIED.
#  - That this happens *regardless of* `cancel-in-progress`: strongly implied by
#    that flag's wording ("currently running") and by the default `queue:
#    single` description, but not stated in those words. INFERRED — and the
#    per-commit group makes it moot either way, which is why the fix does not
#    rest on it.
#  - `github.sha` inside a concurrency group is not a documented pattern.
#    GitHub's documented answer to "let runs queue instead of being cancelled"
#    is `queue: max`, and it CANNOT be used here: the docs state that
#    `queue: max` with `cancel-in-progress: true` is a workflow validation
#    error, and this workflow needs `true` on PR branches. So the group carries
#    the commit instead. `github.run_id` is the documented unique value, but it
#    is unique per RUN rather than per COMMIT, which would also break the PR
#    branch behaviour this keeps.
#
# The release lanes of `deploy-frontends.yml` are deliberately different: each
# serialises its Worker upload on one group with `cancel-in-progress: false`,
# which is a different and correct requirement.
# `.github/scripts/check-workflow-concurrency.mjs` asserts both this and that, so
# neither can drift into the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege for the token Actions injects into every runner.
#
# Nothing here sets `GITHUB_TOKEN` deliberately, but Actions provides one to
# every job regardless, and `actions/checkout`
# persists it into `.git/config` by default. `bun install` then runs lifecycle
# scripts for the whole dependency tree in that same environment, so the DEFAULT
# repository scope is a repo-scoped write credential reachable by every
# postinstall in the tree.
#
# `contents: read` is sufficient, and that was verified rather than assumed:
# every job in this workflow uses only `actions/checkout`, `actions/setup-node`,
# `oven-sh/setup-bun` and `dorny/paths-filter` (which `Changes` grants
# `pull-requests: read` for itself). Nothing pushes, comments, opens a release
# or calls `gh`.
#
# `deploy-frontends.yml` has its own `contents: read` since 2026-10: wrangler
# authenticates with the Cloudflare credentials, never with this token.
permissions:
  contents: read

jobs:
  # Which second-wave jobs a PULL REQUEST needs. Push to main (and any other
  # event) always runs everything: the conditions below only ever skip on
  # `pull_request`.
  #
  # Deliberately narrow. `Lint & Test` and `Frontend Typecheck` are NOT
  # filtered: they carry repo-wide checks (every workspace's typecheck, model
  # defaults across every client, retired vocabulary across the tree). Only
  # `Deploy Script Tests` is filtered: it reads only `.github/`, the Canvas
  # manifest and the bun-pin script, plus the shared inputs — the lockfile, the
  # root manifest and bunfig. The backend's filtered jobs moved to OxyHQ/Gemies
  # with the backend on 2026-11-12.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy_scripts: ${{ steps.filter.outputs.deploy_scripts }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deploy_scripts:
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'
              - '.github/**'
              - 'packages/alia-canvas/package.json'
              - 'scripts/check-bun-pin.mjs'

  # Gates the release logic deploy-frontends.yml runs against production, and
  # the repository-wide wiring checks that read files and install nothing.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    # `changes` is skipped outside pull requests, so `!cancelled()` replaces the
    # implicit success() that would otherwise skip this job on every push.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.deploy_scripts == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Verify the deploy scripts parse
        run: bash -n .github/scripts/*.sh

      # The deploys run on `workflow_run` of CI and decide what to release in
      # deploy-scope.sh: main's head only, and only what changed since the last
      # release. Its "do not release" answers are the ones that can lose a
      # commit, so each is driven both ways against a stubbed `gh`.
      - name: Verify the deploy scope decision
        run: bash .github/scripts/test-deploy-scope.sh

      # `check-static-assets.mjs` runs in `Frontend Typecheck` and goes green
      # when the tree is sound — which is indistinguishable from going green
      # because it stopped looking. Its FIRST version did exactly that: a
      # `grep -E` backreference matched nothing and it reported a clean sweep
      # over five real references. This points it at trees built to be broken
      # and requires it to say so, so its ability to fail is gated too. Runs
      # here because this job installs nothing and needs no workspace.
      - name: Verify the static-asset gate can still fail
        run: node .github/scripts/test-check-static-assets.mjs

      # Runs in the one job that installs nothing. `packageManager` is the one
      # bun pin; a workflow that names its own bun, or none, is a second pin
      # waiting to drift, and only this compares them.
      - name: Verify every workflow runs the pinned bun
        run: node scripts/check-bun-pin.mjs

      - name: Verify that gate can still fail
        run: node .github/scripts/test-check-bun-pin.mjs

      # Same job, same reason: it installs nothing, so it reports before the
      # jobs it protects would be cancelled. A cancelled check is in the check
      # list, is not red, and never ran.
      - name: Verify workflow concurrency
        run: node .github/scripts/check-workflow-concurrency.mjs

      # Same job, same reason. The Canvas Worker deploy is a post-merge job that
      # a paths-filter skips on most pushes, so "is Deploy Frontends green"
      # answers the same whether or not it works — it failed five consecutive
      # real runs unnoticed. This asserts the wiring; the step below in
      # `Frontend Typecheck` exercises the behaviour.
      - name: Verify the Canvas deploy is wired to a declared wrangler
        run: node .github/scripts/check-canvas-deploy-wiring.mjs

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Not a literal: `packageManager` in package.json is the one pin, and
          # scripts/check-bun-pin.mjs fails when any setup-bun step runs a bun
          # other than it.
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Frozen: bun.lock is installed verbatim or the step fails. Under bun
      # 1.3.14 the frozen check falsely reported drift on this monorepo, so CI
      # ran a plain install and diffed bun.lock instead; on 1.4.3 it passes on a
      # clean checkout with a cold cache, so the real check is back.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Oxy dependency health
        run: bun run doctor:oxy

      # Translation keys follow ADR 0055: nested identifier segments under a
      # namespace, and no key in a translation that English lacks.
      - name: Translation key convention
        run: bun run i18n:check

      # One Biome pass over the whole repository: formatting, the recommended
      # lint preset, and the guards ported from the per-package ESLint configs
      # it replaced (`biome.json` overrides; the Expo `process.env` rules are
      # GritQL plugins under `biome-plugins/`). `biome ci` never writes, and
      # fails on any formatting drift or lint error anywhere in the tree.
      - name: Lint and format check (Biome)
        run: bunx biome ci .

      # The half of ESLint's `ban-ts-comment` Biome cannot express: the no-check
      # pragma, and an expect-error with no description. Biome's GritQL plugins
      # match syntax nodes and comments are trivia, so this is a script. It needs
      # the installed `typescript` to read comments the way the compiler does.
      - name: Check TypeScript directive comments
        run: node scripts/check-ts-directives.mjs

      - name: Verify that gate can still fail
        run: node .github/scripts/test-check-ts-directives.mjs

      # The server SDK publishes compiled ESM + CJS + types, unlike
      # @alia.onl/sdk, and `check:entrypoints` below compiles a consumer against
      # that build. A build that only runs at `npm publish` time is a build
      # nobody has run.
      - name: Build server SDK
        run: bun run --filter @alia.onl/server build

      - name: Typecheck SDK
        run: bun run --filter @alia.onl/sdk typecheck

      - name: Test SDK streaming contract
        run: bun run --filter @alia.onl/sdk test

      - name: Test SDK optional Metro resolver
        run: bun run --filter @alia.onl/sdk test:metro

      # @alia.onl/sdk ships raw source, so anything the root entry can reach is
      # compiled into every text-chat consumer's bundle. Keeps the voice call
      # behind the ./voice entry, and the retired livekit-client out of both.
      - name: Check SDK entry isolation
        run: bun run --filter @alia.onl/sdk check:entries

      # The SDK's own typecheck compiles every file at once, so it cannot see an entry that leans
      # on something only another entry brings in (21.4.0–21.5.2: `/text` without NativeWind's
      # `className` types). This compiles a consumer of each entry alone.
      - name: Check SDK entry types
        run: bun run --filter @alia.onl/sdk check:entry-types

      - name: Typecheck server SDK
        run: bun run --filter @alia.onl/server typecheck

      # The fixtures write the `/v1/chat/completions` wire byte for byte as the
      # API's SSE writers do (`tests/wire.ts`); the writers themselves, and the
      # suite that runs this client against them, live in OxyHQ/Gemies.
      - name: Test server SDK against the chat-completions wire
        run: bun run --filter @alia.onl/server test

      # Typecheck, tests and build all passed on 1.0.0 while the published
      # package could not be compiled against from a CommonJS backend — the
      # defect was in the exports map, which none of them read. This compiles a
      # real `module: node16` consumer against the built package.
      - name: Check server SDK entry points
        run: bun run --filter @alia.onl/server check:entrypoints

  # The frontend packages had no typecheck, no lint and no test script between
  # them, and none of them was referenced by this workflow — so every frontend PR
  # merged on a green that said nothing about it. This is the gate for that.
  #
  # Deliberately NOT `needs: lint-and-test`. A dependent job that never runs
  # reports no conclusion, which reads as "not failing"; keeping this independent
  # means a red SDK cannot mask a red app, and each gets its answer without
  # waiting on the other.
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Enumerates the workspaces and requires each to be checked here, checked by
      # a named job elsewhere, explicitly excluded, or explicitly scriptless — so
      # a new package cannot join the repo unnoticed. See the script's header.
      - name: Typecheck workspaces
        run: bun .github/scripts/typecheck-workspaces.ts

      # `@alia/app`'s typecheck runs `expo customize tsconfig.json` first, because
      # `typedRoutes` is inert until `.expo/types/router.d.ts` exists: measured on
      # this tree, a `router.push('/not-a-route')` is a hard error with it and
      # passes clean without it. That command can also rewrite the tsconfig from
      # Expo's template, which would be a silent change to a tracked file — so it
      # is asserted not to have.
      - name: Assert the Expo generator did not rewrite tsconfig
        run: git diff --exit-code packages/app/tsconfig.json

      # `alia-canvas` had a `tsc -b` and a wrangler dry-run between them and
      # nothing else. Its first subject is `lib/product-modes.ts`, which decides
      # what a person is offered and what identifier a node stores — the file
      # whose own header records that the module it replaced showed a hardcoded
      # alias name under a label reading "Model", for every node, for as long as
      # the editor existed.
      - name: Test Canvas
        run: bun run --filter alia-canvas test

      # `@alia/app` has had a `test` script and, until now, no job calling it —
      # a suite that cannot fail. The effort selector is
      # its first real subject: the control it renders depends on platform and
      # width, and the haptic tick fires from inside a worklet, so neither is
      # visible to `tsc`. Mutation-verified when it was written — inverting the
      # small-screen gate fails three of the four cases, and deleting the
      # once-per-boundary guard fails exactly the case that names it.
      - name: Test app
        run: bun run --filter @alia/app test

      # `require('…/thing.png')` is typed `any`, so `tsc` never resolves it: a
      # source file naming a deleted asset passes every gate here and fails in
      # Metro at runtime. It happened — the agent avatar's PNGs were deleted in
      # one PR and the last `require` of them removed in another, and the safe
      # order was luck.
      - name: Verify every static asset a source file names exists
        run: node scripts/check-static-assets.mjs

      # The alia.onl and Canvas Workers: CORS on the SDK's shared files, a
      # year-long immutable cache on content-hashed files, a 404 (not the app
      # shell) for a hashed name a deploy lacks. Plain `node --test`, no build.
      - name: Test the asset Workers
        run: node --test scripts/asset-worker.test.mjs

      # `alia-canvas` is a solution-style project (`"files": []`, references
      # only), so `tsc --noEmit` in it compiles NOTHING and exits 0 — which is
      # why `typecheck-workspaces.ts` lists it as scriptless and points at the
      # `tsc -b` inside its own `build`. That build only ran in
      # `deploy-frontends.yml`, on main, AFTER merge. This is the same check,
      # before it.
      - name: Typecheck the solution-style frontend
        run: bunx tsc -b packages/alia-canvas

      # The Canvas Worker deploy, minus the publish — the same wrangler, the
      # same wrangler.toml and the same build output that `deploy-frontends.yml`
      # ships, run on every pull request instead of only after merge. That
      # timing is the point: the deploy job is behind a paths-filter, so it is
      # SKIPPED on most pushes, and a workflow whose only failing job is skipped
      # reports success.
      #
      # `--dry-run` needs no credentials — it stops before authenticating — and
      # it is not a no-op: it fails if the assets directory is missing and if
      # wrangler does not recognise a key in the config, both verified against
      # wrangler 4.125.0. The build is ~3s.
      - name: Dry-run the Canvas Worker deploy
        run: |
          bun run build:canvas
          bun run --cwd packages/alia-canvas deploy:dry
        env:
          NODE_ENV: production
          VITE_API_URL: https://api.alia.onl

      # No client names a model: with nothing chosen a request carries no
      # `model` and the server's default answers. It spans every client source
      # tree, and every workspace the repo declares must be either walked by it
      # or classified as shipping no picker — so it is a script rather than any
      # one package's suite.
      - name: Check no client hardcodes a model default
        run: node scripts/check-model-defaults.mjs

      # Retired product routes and the retired app-agent lane (ADR 0020 §8).
      - name: Check retired vocabulary cannot return
        run: node scripts/check-retired-vocabulary.mjs
