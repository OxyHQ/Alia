# Move a frontend from Cloudflare Pages to a Worker, so its Pages default
# hostname stops existing.
#
# Written for Canvas, generalised when the SAME defect turned up on the main app:
# `alia-app.pages.dev` served a byte-identical copy of `alia.onl` and was in
# neither CORS allowlist, so it rendered the shell and failed every call. Two
# callers is where a second copy of this file would have started drifting from
# the first, so it takes the package and build script as inputs instead.
#
# WHY: a Pages project ALWAYS serves `<project>.pages.dev`, and Cloudflare
# offers no way to switch it off — `wrangler pages project` has only `list`,
# `create` and `delete`. That left a second working copy of Canvas at
# `alia-canvas.pages.dev`; the best Pages could do was redirect it. A Worker
# declines its default hostname outright with `workers_dev = false`, so after
# this the only name that reaches Canvas is `canvas.alia.onl`.
#
# WHY A WORKFLOW: every Cloudflare token on the machine is dead. The working
# credential is the org secret `CLOUDFLARE_API_TOKEN`, and a GitHub secret
# cannot be read out — only used from inside a run.
#
# THE ORDER IS THE SAFETY, and it was WRONG on the first attempt. Deploying the
# Worker first looked safest — code in place before the domain moves — but a
# Worker custom domain insists on managing its own DNS record and refuses to
# claim a hostname that already has one:
#
#   Hostname 'canvas.alia.onl' already has externally managed DNS records
#   (A, CNAME, etc). Delete them first or try a different hostname. [code: 100117]
#
# That record is the proxied CNAME `bind-pages-domain.yml` created. So the
# record has to go BEFORE the Worker can take the hostname, and the sequence
# below is built around that — with the destructive step still last and gated:
#
#   1. delete the DNS record        — the hostname stops resolving
#   2. detach the domain from Pages — Pages releases its claim
#   3. deploy the Worker            — claims the hostname, writes its OWN record
#   4. WAIT until it really serves  — a real fetch, not an API claim
#   5. delete the Pages project     — only reachable if 4 passed
#   6. assert pages.dev is GONE     — the thing this exists to achieve
#
# THE RECORD GOES FIRST, NOT THE DETACH, and that is deliberate. Detaching while
# the CNAME still points at `alia-canvas.pages.dev` would send every request to
# a Pages deployment whose `_worker.js` 301s `canvas.alia.onl` right back — a
# redirect loop. Deleting the record first makes the gap an honest NXDOMAIN.
#
# THERE IS A BRIEF OUTAGE between step 1 and step 3, roughly the length of one
# `wrangler deploy`. It is unavoidable: the hostname cannot belong to both, and
# the record cannot exist while the Worker claims it.
#
# DRY RUN FIRST. `dry_run: true` runs everything that changes nothing — the
# inspection below, the install, the build and `wrangler deploy --dry-run` — and
# skips every step from the record delete onwards. It is a rehearsal of the
# whole approach, not just a look at DNS.
#
# THE INSPECTION RUNS ON THE REAL PATH TOO, immediately before the first
# destructive step. A cutover that goes wrong then has the prior state in its
# own log instead of something to reconstruct from memory afterwards.
#
# THE RECORD DELETE IS TYPE-SCOPED, learned the hard way. It used to take
# `.result[0]` from `dns_records?name=$HOSTNAME` — a query that filters by name
# and NOT by type — and delete that one record. At the apex `alia.onl` the list
# was two entries, `CNAME -> alia-app.pages.dev` and `TXT "v=spf1 -all"`: the
# CNAME went, the read-back counted the SPF record still sitting there, and the
# run stopped before the detach. The guard was right; the delete was wrong
# twice, once in assuming a single record and once in a read-back that counted
# records which never blocked anything. Only A, AAAA and CNAME provoke 100117,
# and an apex SPF record has to survive a hostname migration — so the loop and
# its read-back are both scoped to address records.
#
# If step 4 never succeeds the run FAILS THERE, with the Pages project still
# intact. Recovery is `bind-pages-domain.yml`, which re-creates the record and
# re-attaches the domain to Pages. Nothing is unrecoverable until step 5, and
# step 5 cannot be reached on a broken cutover.
name: Migrate Pages Project to Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-PAGES-PROJECT to confirm this destroys the Pages project
        required: true
      dry_run:
        description: Inspect and stop. Prints the DNS records, the Pages domain and the Worker, and changes nothing.
        type: boolean
        default: false
      hostname:
        description: The custom domain it is served on
        required: true
        default: alia.onl
      pages_project:
        description: The Pages project to retire
        required: true
        default: alia-app
      package_dir:
        description: The workspace directory holding wrangler.toml and dist
        required: true
        default: packages/app
      build_script:
        description: The root package.json script that builds it
        required: true
        default: build
      zone:
        description: The Cloudflare zone the hostname sits in
        required: true
        default: alia.onl

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.pages_project }} -> Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOSTNAME: ${{ inputs.hostname }}
      PAGES_PROJECT: ${{ inputs.pages_project }}
      PACKAGE_DIR: ${{ inputs.package_dir }}
      ZONE: ${{ inputs.zone }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      # A typo in an input must not delete a production project.
      - name: The confirmation phrase is exact
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "DELETE-PAGES-PROJECT" ] \
            || { echo "::error::confirm must be exactly DELETE-PAGES-PROJECT"; exit 1; }

      # An org secret marked "Public repositories" never reaches a private repo
      # and arrives as an EMPTY STRING with no error of its own.
      - name: The credentials actually arrived
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          ok=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.success')
          [ "$ok" = "true" ] || { echo "::error::token rejected"; exit 1; }

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What the world looks like before
        run: |
          set -euo pipefail
          {
            echo "### Before"
            echo '```'
            echo "$HOSTNAME             -> http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOSTNAME/" || echo 000)"
            echo "$PAGES_PROJECT.pages.dev -> http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$PAGES_PROJECT.pages.dev/" || echo 000)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # EVERYTHING THIS IS ABOUT TO CHANGE, ENUMERATED. The step above prints
      # HTTP codes, which say the site is up without saying what is holding it
      # up. The first attempt at this cutover stopped on a record nobody knew
      # existed and the log could not say which one it was.
      #
      # A permission the token lacks does not fail the run: each section prints
      # either its rows or why it could not read them, so a token without
      # Workers:Read still yields the DNS and Pages sections. The zone lookup is
      # the one exception, because the delete step needs the same id and would
      # fail on it a few steps later regardless.
      - name: Enumerate the records, the Pages domain and the Worker
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4

          # The steps below read `inputs.dry_run` through `if:`; this reads the
          # same input through the environment. A value that is neither `true`
          # nor `false` would make the two disagree, and the way that shows up
          # is six skipped steps and a green run that changed nothing.
          [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "false" ] \
            || { echo "::error::dry_run must be true or false, got '$DRY_RUN'"; exit 1; }

          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones?name=$ZONE" -o /tmp/insp-zone.json
          zone=$(jq -r '.result[0].id // empty' /tmp/insp-zone.json)
          [ -n "$zone" ] || { echo "::error::zone $ZONE not found"; exit 1; }

          conf="$PACKAGE_DIR/wrangler.toml"
          [ -f "$conf" ] || { echo "::error::$conf not found"; exit 1; }
          worker=$(awk -F'"' '/^[[:space:]]*name[[:space:]]*=/ {print $2; exit}' "$conf")

          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones/$zone/dns_records?name=$HOSTNAME" -o /tmp/insp-dns.json
          pages_code=$(curl -sS -o /tmp/insp-pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains")
          scripts_code=$(curl -sS -o /tmp/insp-scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          wdomains_code=$(curl -sS -o /tmp/insp-wdomains.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?zone_id=$zone")
          routes_code=$(curl -sS -o /tmp/insp-routes.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones/$zone/workers/routes")

          {
            echo "### Inspection: what exists right now"
            echo
            echo "**DNS records named \`$HOSTNAME\`** (zone \`$ZONE\`, id \`$zone\`)."
            echo "Only A, AAAA and CNAME are deleted; anything else at this name is left alone."
            echo '```'
            jq -r 'if (.result | length) == 0 then "(none - the hostname does not resolve)"
                   else (.result[] | "\(.type)  \(.content)  proxied=\(.proxied)  ttl=\(.ttl)  id=\(.id)")
                   end' /tmp/insp-dns.json
            echo '```'
            echo
            echo "**Pages project \`$PAGES_PROJECT\`, custom domains.**"
            echo '```'
            if [ "$(jq -r '.success' /tmp/insp-pages.json)" = "true" ]; then
              jq -r 'if (.result | length) == 0 then "(no custom domain attached)"
                     else (.result[] | "\(.name)  status=\(.status)  validation=\(.validation_data.status // "-")  id=\(.id)")
                     end' /tmp/insp-pages.json
            else
              echo "(unreadable: http=$pages_code $(jq -c '.errors // []' /tmp/insp-pages.json))"
            fi
            echo '```'
            echo
            echo "**Worker \`$worker\`.**"
            echo '```'
            if [ "$(jq -r '.success' /tmp/insp-scripts.json)" = "true" ]; then
              jq -r --arg w "$worker" 'if ([.result[] | select(.id == $w)] | length) == 0
                     then "script: does not exist yet"
                     else (.result[] | select(.id == $w) | "script: exists, modified \(.modified_on)")
                     end' /tmp/insp-scripts.json
            else
              echo "script: (unreadable: http=$scripts_code $(jq -c '.errors // []' /tmp/insp-scripts.json))"
            fi
            if [ "$(jq -r '.success' /tmp/insp-wdomains.json)" = "true" ]; then
              jq -r 'if (.result | length) == 0 then "custom domains in this zone: none"
                     else (.result[] | "custom domain: \(.hostname) -> \(.service) [\(.environment)] id=\(.id)")
                     end' /tmp/insp-wdomains.json
            else
              echo "custom domains: (unreadable: http=$wdomains_code $(jq -c '.errors // []' /tmp/insp-wdomains.json))"
            fi
            if [ "$(jq -r '.success' /tmp/insp-routes.json)" = "true" ]; then
              jq -r 'if (.result | length) == 0 then "routes in this zone: none"
                     else (.result[] | "route: \(.pattern) -> \(.script // "-") id=\(.id)")
                     end' /tmp/insp-routes.json
            else
              echo "routes: (unreadable: http=$routes_code $(jq -c '.errors // []' /tmp/insp-routes.json))"
            fi
            echo "declared in $conf:"
            grep -nE '^[[:space:]]*(name|workers_dev|pattern|custom_domain)[[:space:]]*=' "$conf" | sed 's/^/  /'
            echo '```'
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **DRY RUN.** Every step from the record delete onwards is skipped. Nothing was changed."
            else
              echo "> Proceeding: the address records listed above are deleted next."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The git dependency `libsignal` is fetched from GitHub unauthenticated and
      # cannot be authenticated; a warm cache is what stops that request being
      # made. A cutover is the worst possible moment to discover a degraded
      # GitHub tarball host, and `.github/scripts/check-bun-cache-wiring.mjs`
      # fails if this is removed — it is what caught its absence here.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install and build
        run: |
          bun install --ignore-scripts
          bun run ${{ inputs.build_script }}

      # Everything `wrangler deploy` needs, EXCEPT the upload, done while the
      # site is still up. The deploy step below is the only thing standing
      # between the DNS record going and service returning, so resolving the
      # tool from the registry there — a round trip, and a download on a cache
      # miss — would spend the outage on something that has nothing to do with
      # the cutover. This also validates `wrangler.toml` before anything is
      # destroyed: a config error surfaces here, with the site still serving.
      - name: Warm wrangler and validate the config, before the window opens
        working-directory: ${{ inputs.package_dir }}
        run: bunx wrangler@4 deploy --dry-run
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_ENV: production
          VITE_API_URL: https://api.alia.onl

      # 1. The record goes first. A Worker custom domain writes its own, and
      #    refuses a hostname that already has one (code 100117). Deleting it
      #    before the detach also avoids a redirect loop — see the header.
      - name: Delete the DNS records so the Worker can write its own
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # A hostname can carry more than one address record, and `?name=` also
          # returns every other type sitting at that name. Both halves of this
          # step read the same filter so they cannot drift apart: what gets
          # deleted and what the read-back demands be gone are one definition.
          blocking='select(.type == "A" or .type == "AAAA" or .type == "CNAME")'
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE" -o /tmp/z.json
          zone=$(jq -r '.result[0].id // empty' /tmp/z.json)
          [ -n "$zone" ] || { echo "::error::zone $ZONE not found"; exit 1; }
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$HOSTNAME" -o /tmp/r.json
          ids=$(jq -r ".result[] | $blocking | .id" /tmp/r.json)
          if [ -z "$ids" ]; then
            echo "no address record to delete — continuing"
          else
            for rec in $ids; do
              what=$(jq -r --arg id "$rec" '.result[] | select(.id == $id) | .type + " -> " + .content' /tmp/r.json)
              echo "deleting $what ($rec)"
              code=$(curl -sS -o /tmp/rd.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$rec")
              # Per record, not once for the batch: one failure in the middle
              # would otherwise be papered over by the next success.
              [ "$(jq -r '.success' /tmp/rd.json)" = "true" ] \
                || { echo "::error::record delete failed for $what (http=$code): $(jq -c '.errors' /tmp/rd.json)"; exit 1; }
            done
          fi
          # Read back: a DELETE that reports success and leaves the record is
          # indistinguishable from one that worked, and the next step would then
          # fail with the same 100117 for a reason that looks unrelated.
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$HOSTNAME" -o /tmp/r2.json
          left=$(jq -r "[.result[] | $blocking] | length" /tmp/r2.json)
          kept=$(jq -r '[.result[] | .type] | join(",")' /tmp/r2.json)
          echo "address records for $HOSTNAME now: $left (still at this name: ${kept:-none})"
          [ "$left" = "0" ] || { echo "::error::$left address record(s) still present"; exit 1; }

      # 2. Pages releases its claim. Doing this AFTER the record is gone means
      #    the gap is an NXDOMAIN rather than requests reaching a Pages
      #    deployment that would 301 them straight back here.
      - name: Detach the domain from the Pages project
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/det.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains/$HOSTNAME")
          if [ "$(jq -r '.success' /tmp/det.json)" = "true" ]; then
            echo "detached"
          elif jq -e '.errors[]?|select(.message|test("not found|does not exist";"i"))' /tmp/det.json >/dev/null; then
            echo "already detached — continuing"
          else
            echo "::error::detach failed (http=$code): $(jq -c '.errors' /tmp/det.json)"; exit 1
          fi

      # 3. The Worker claims the hostname and writes its own DNS record, which
      #    is what `custom_domain = true` in wrangler.toml means.
      - name: Deploy the Worker and claim the hostname
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ inputs.package_dir }}
        run: bunx wrangler@4 deploy

      # 4. THE GATE. Everything above is an API claim; only this is evidence a
      #    browser can reach Canvas. Nothing destructive runs unless it passes.
      - name: The Worker really serves the domain
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # A wall-clock deadline rather than an attempt count. 30 attempts of
          # `--max-time 15` plus `sleep 20` is up to 17 minutes, and with the
          # install and build ahead of it that overran the 25-minute job — so
          # the runner could kill this step before it reached its own
          # `::error::`, which carries the recovery instruction. Losing that
          # line is losing the most valuable output in the file.
          end=$((SECONDS + 420))
          i=0
          while [ $SECONDS -lt $end ]; do
            i=$((i+1))
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' --max-time 15 "https://$HOSTNAME/" || echo 000)
            echo "attempt $i (${SECONDS}s of 420): http=$code"
            if [ "$code" = "200" ] && grep -qiE "<title>[^<]+</title>" /tmp/body.html; then
              echo "serving, and it returned a real document"
              # The SPA fallback `not_found_handling` replaces.
              deep=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOSTNAME/workflow/abc")
              echo "deep link: http=$deep"
              [ "$deep" = "200" ] || { echo "::error::SPA fallback is not working — refusing to delete Pages"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::$HOSTNAME does not serve from the Worker. The Pages project is UNTOUCHED — re-attach the domain to it to restore service."
          exit 1

      # 5. The only irreversible step, and it is unreachable unless step 4
      #    proved the replacement works.
      - name: Delete the Pages project
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          echo "delete http=$code success=$(jq -r '.success' /tmp/del.json)"
          [ "$(jq -r '.success' /tmp/del.json)" = "true" ] \
            || { echo "::error::delete failed: $(jq -c '.errors' /tmp/del.json)"; exit 1; }
          # Read back: a DELETE that reports success and leaves the project is
          # indistinguishable from one that worked.
          list=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            | jq -r '[.result[].name]|join(",")')
          echo "projects now: $list"
          echo "$list" | tr ',' '\n' | grep -qx "$PAGES_PROJECT" \
            && { echo "::error::$PAGES_PROJECT is still listed"; exit 1; } || true

      # 6. What this whole workflow is for.
      # ADVISORY, and marked so. Everything destructive is already done and
      # already asserted — step 5 reads the project list back. This only waits
      # for edge cache to expire, its own error text concedes the failure is not
      # actionable, and at 15 x 20s it was spending five minutes of the job
      # budget that the gate above needs.
      - name: The Pages hostname is gone
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$PAGES_PROJECT.pages.dev/" || echo 000)
            echo "attempt $i: $PAGES_PROJECT.pages.dev -> http=$code"
            # 200 or 301 means it is still ours and still answering. Anything
            # else — 404, 522, a dead connection — means it no longer resolves
            # to a project of ours, which is the goal.
            case "$code" in
              200|301|302) sleep 20; continue;;
              *) {
                   echo "### After"
                   echo '```'
                   echo "$HOSTNAME             -> http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOSTNAME/")"
                   echo "$PAGES_PROJECT.pages.dev -> http=$code (gone)"
                   echo '```'
                 } >> "$GITHUB_STEP_SUMMARY"
                 echo "retired"; exit 0;;
            esac
          done
          echo "::error::$PAGES_PROJECT.pages.dev still answers. The project was deleted (asserted above), so this is edge cache — re-run this step before assuming it failed."
          exit 1
