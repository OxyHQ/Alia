# Bind a Cloudflare Pages project to the domain it belongs on.
#
# WHY THIS IS A WORKFLOW AND NOT A SCRIPT SOMEONE RUNS LOCALLY: every
# Cloudflare token on this machine is dead. `~/.config/oxy/tokens/cloudflare.token`
# and the vault copy both answer `Invalid access token`, they do not even match
# each other, and the vault's own note records the date they died. The only
# working credential is the GitHub organisation secret `CLOUDFLARE_API_TOKEN`
# (`visibility=all`), which `deploy-frontends.yml` already uses — and a GitHub
# secret cannot be read out, only used from inside a run. So this is the one
# place the change can be made from.
#
# WHY IT IS `workflow_dispatch` ONLY: it mutates DNS. Nothing should trigger
# that on a push.
#
# WHAT IT FIXES, CONCRETELY: `canvas.alia.onl` already resolves — to
# `alia-production-3kc6h.ondigitalocean.app`, the decommissioned DigitalOcean
# app `.do/app.yaml` still declares. That host answers nothing (`http=000`), so
# Canvas is only reachable on the Pages default `alia-canvas.pages.dev`.
# `console.alia.onl` is dead in exactly the same way and is the second caller
# for this, which is why the hostname and project are inputs rather than baked
# in.
#
# THIS IS THE WORKFLOW YOU REACH FOR WHEN SOMETHING IS ALREADY BROKEN, so it is
# held to a higher standard than the one that broke it — and on 2026-08-26 it
# was not. It read `dns_records?name=$HOSTNAME`, a query that filters by name
# and NOT by type, took `.result[0]`, and PUT a CNAME over it. Recovering
# `alia.onl` from a 15-minute outage, `.result[0]` was `TXT "v=spf1 -all"`: the
# site came back and the domain's SPF record was destroyed. Its read-back was
# `.result[0]` too, so it read the CNAME it had just written and reported
# success.
#
# WHAT REPLACES IT, and why the failure is now structural rather than guarded:
#
#   * The destructive half is `cloudflare-clear-address-records.sh`, shared with
#     `migrate-pages-to-worker.yml`. One file decides what an address record is,
#     so the two workflows cannot come to disagree about it, and that file
#     enumerates every record it is NOT deleting and checks each one survived.
#   * What follows is a CREATE, never a replace. A POST of a CNAME cannot land
#     on a TXT record the way a PUT can, so the incident has no form to take
#     here — there is no `.result[0]` left in this file.
#   * The read-back asks for `&type=CNAME`. The query carries the type, so no
#     filter here has to know one.
#
# EVERY WRITE IS READ BACK. A Cloudflare API call that returns `success: true`
# having changed nothing, and one that genuinely changed something, are
# indistinguishable from the response alone — so each step re-reads the field it
# just wrote and fails if it does not hold. The final step then resolves the
# hostname over real DNS and fetches it, because an API that reports a record
# and a browser that can reach it are different claims.
name: Bind Pages Domain

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: The full hostname to bind (e.g. canvas.alia.onl)
        required: true
        default: canvas.alia.onl
      project:
        description: The Cloudflare Pages project name (e.g. alia-canvas)
        required: true
        default: alia-canvas
      zone:
        description: The Cloudflare zone the hostname sits in
        required: true
        default: alia.onl

permissions:
  contents: read

jobs:
  bind:
    name: Bind ${{ inputs.hostname }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOSTNAME: ${{ inputs.hostname }}
      PROJECT: ${{ inputs.project }}
      ZONE: ${{ inputs.zone }}

    steps:
      # Fail loudly and early rather than emitting `Bearer ` and reading the
      # 400 as a Cloudflare problem. An org secret marked "Public repositories"
      # never reaches a private repo, and arrives as an EMPTY STRING with no
      # error of its own.
      - name: The credentials actually arrived
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::CLOUDFLARE_API_TOKEN is empty — the org secret did not reach this repo"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          ok=$(jq -r '.success' /tmp/verify.json)
          echo "token verify: http=$code success=$ok status=$(jq -r '.result.status // "-"' /tmp/verify.json)"
          [ "$ok" = "true" ] || { echo "::error::token rejected: $(jq -c '.errors' /tmp/verify.json)"; exit 1; }

      # The DNS work lives in a script now, shared with the cutover workflow, so
      # this needs the tree. It is checked out from the ref this run was
      # dispatched against, which is the same ref whose YAML is executing.
      - uses: actions/checkout@v4

      - name: What the world looks like before
        run: |
          set -euo pipefail
          echo "### Before" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "dig $HOSTNAME -> $(dig +short "$HOSTNAME" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "curl https://$HOSTNAME/ -> http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOSTNAME/" || echo 000)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the zone
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE" -o /tmp/zone.json
          [ "$(jq -r '.success' /tmp/zone.json)" = "true" ] || { echo "::error::zone lookup failed: $(jq -c '.errors' /tmp/zone.json)"; exit 1; }
          id=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          [ -n "$id" ] || { echo "::error::zone $ZONE not found on this account — the token may be scoped to a different one"; exit 1; }
          echo "ZONE_ID=$id" >> "$GITHUB_ENV"
          echo "zone $ZONE resolved"

      # Cloudflare will not create its own record while a conflicting one
      # exists, and the conflicting one here is whatever address record the
      # hostname already carries — the CNAME to the dead DigitalOcean app, or
      # the one a failed cutover left behind. It is cleared, then a fresh CNAME
      # is created, PROXIED: per the documented model, frontends are proxied
      # CNAMEs to `*.pages.dev` and Cloudflare terminates TLS. A DNS-only record
      # would serve the Pages origin without a certificate for this hostname.
      #
      # `.github/scripts/test-cloudflare-cutover.sh` extracts this `run:` block
      # from this file and executes it against a stubbed Cloudflare, including
      # the case that cost `alia.onl` its SPF record.
      - name: The address record is a proxied CNAME to the Pages project
        run: |
          set -euo pipefail
          target="${PROJECT}.pages.dev"

          # Deletes A, AAAA and CNAME at this name and NOTHING else, and fails
          # if any record it was not deleting stopped existing.
          bash .github/scripts/cloudflare-clear-address-records.sh "$ZONE" "$HOSTNAME"

          # A create, not a replace. There is no `.result[0]` here to land on
          # the wrong record: the address records are already gone, and a POST
          # of a CNAME cannot overwrite a TXT.
          echo "creating CNAME $HOSTNAME -> $target (proxied)"
          code=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg n "$HOSTNAME" --arg c "$target" '{type:"CNAME",name:$n,content:$c,proxied:true,ttl:1}')" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")
          [ "$(jq -r '.success' /tmp/put.json)" = "true" ] \
            || { echo "::error::record write failed (http=$code): $(jq -c '.errors' /tmp/put.json)"; exit 1; }

          # Read back, because `success: true` is not evidence the field holds.
          # `&type=CNAME` on the query is what makes this safe: the type is the
          # server's problem, so nothing here indexes into a mixed list.
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$HOSTNAME&type=CNAME" -o /tmp/after.json
          [ "$(jq -r '.success' /tmp/after.json)" = "true" ] \
            || { echo "::error::read-back failed: $(jq -c '.errors' /tmp/after.json)"; exit 1; }
          n=$(jq -r '.result | length' /tmp/after.json)
          [ "$n" = "1" ] || { echo "::error::$HOSTNAME has $n CNAME record(s), expected exactly 1"; exit 1; }
          got_content=$(jq -r '.result[0].content' /tmp/after.json)
          got_proxied=$(jq -r '.result[0].proxied' /tmp/after.json)
          echo "record now: CNAME $HOSTNAME -> $got_content proxied=$got_proxied"
          [ "$got_content" = "$target" ] || { echo "::error::content is $got_content, expected $target"; exit 1; }
          [ "$got_proxied" = "true" ] || { echo "::error::record is not proxied — Cloudflare would not terminate TLS for this hostname"; exit 1; }

      # Idempotent: a domain already attached returns an error naming that, and
      # this treats it as success rather than failing a re-run.
      - name: Attach the domain to the Pages project
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dom.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg n "$HOSTNAME" '{name:$n}')" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains")
          if [ "$(jq -r '.success' /tmp/dom.json)" = "true" ]; then
            echo "attached"
          elif jq -e '.errors[]?|select(.message|test("already";"i"))' /tmp/dom.json >/dev/null; then
            echo "already attached — nothing to do"
          else
            echo "::error::attach failed (http=$code): $(jq -c '.errors' /tmp/dom.json)"; exit 1
          fi

      - name: The project lists the domain
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" -o /tmp/doms.json
          echo "domains on $PROJECT: $(jq -r '[.result[].name]|join(", ")' /tmp/doms.json)"
          jq -e --arg n "$HOSTNAME" '.result[]|select(.name==$n)' /tmp/doms.json >/dev/null \
            || { echo "::error::$HOSTNAME is not listed on the project"; exit 1; }
          echo "status: $(jq -r --arg n "$HOSTNAME" '.result[]|select(.name==$n)|.status' /tmp/doms.json)"

      # The load-bearing check. An API that reports a record and a browser that
      # can reach the site are different claims, and only the second is the
      # thing anyone wanted. Certificate issuance is not instant, so this waits
      # rather than asserting once — and says plainly when it runs out of
      # patience instead of reporting success.
      - name: A browser can actually reach it
        run: |
          set -euo pipefail
          # A wall-clock deadline, not an attempt count. With 30 attempts of
          # `--max-time 15` plus `sleep 20` this loop could run 17 minutes
          # against a 10-minute job: the runner killed the job BEFORE the loop
          # exhausted, so the `::error::` below — the line that says this is
          # probably certificate issuance and to re-run — was unreachable in
          # exactly the case it was written for.
          end=$((SECONDS + 480))
          i=0
          while [ $SECONDS -lt $end ]; do
            i=$((i+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOSTNAME/" || echo 000)
            echo "attempt $i (${SECONDS}s of 480): http=$code"
            if [ "$code" = "200" ]; then
              echo "### After" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "dig $HOSTNAME -> $(dig +short "$HOSTNAME" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
              echo "curl https://$HOSTNAME/ -> http=200" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$HOSTNAME still does not serve after 8 minutes. The record and the project binding are in place (both asserted above), so this is certificate issuance or propagation — re-run this step before assuming it failed."
          exit 1
