# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute alia (ecs service + ecr repo name) and packages/api/Dockerfile (path).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize production rollouts. Two overlapping runs each register a task
  # definition revision and then call update-service; interleaved, the older
  # image wins and the newer run still reports success. Never cancel in
  # progress: an interrupted run leaves an unmonitored rollout in ECS.
  group: deploy-alia-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: alia
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/api/Dockerfile

jobs:
  deploy:
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # The backstop, and deliberately loose — the tight bound is on the build
    # step, which is where the hangs actually happen.
    #
    # Without any bound the job inherits GitHub's 6-hour default, and the
    # `concurrency` group above never cancels in progress, so a hung job holds
    # production rollouts for those six hours. Worse, GitHub keeps only the most
    # recent PENDING run per group, so everything queued behind it is cancelled
    # having never run. Measured 2026-08-19: `fc613f2d` hung 43 min, and
    # `f52a8db6` and `9c3edb79` were both cancelled with ZERO jobs — neither
    # commit was ever built, and their `cancelled` conclusions say nothing about
    # their own content.
    #
    # The number has to sit ABOVE deploy-ecs-image.sh's own ceiling, never
    # below. That script bounds every wait at MAX_WAIT_SECS (1200s), and on this
    # workflow's configuration — RUN_MIGRATIONS plus a POST_DEPLOY_TASK_COMMAND
    # — the longest chain is four sequential ones: the pre-phase migration
    # one-shot, the rollout, the post-deploy reconciliation one-shot, and the
    # rollback a failure of that last one triggers. 4 x 20 = 80 min. Add the
    # 15-minute build bound below and the measured worst case of 2m20s for
    # every other step combined (100 successful runs), and the ceiling is 98.
    #
    # Killing the job inside those 80 minutes is the one genuinely dangerous
    # outcome available here: it strands precisely the unmonitored ECS rollout
    # the concurrency comment above exists to prevent. A `packages/api` test
    # re-derives this arithmetic from the script, so raising MAX_WAIT_SECS
    # without raising this fails rather than silently arming that kill.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The secrets are enumerated one at a time, on purpose.
      #
      # This step used to expand the entire `secrets` context with
      # `toJSON(secrets)`, and that is what holds deploys. A workflow that walks
      # every repository secret into a shell loop is shaped exactly like an
      # exfiltration payload, so GitHub creates the run with conclusion
      # `action_required` and ZERO jobs until a human clicks "Approve and run"
      # in the UI. The REST approve endpoint only serves fork pull requests, so
      # it cannot be automated, and the approval is per run — every deploy needs
      # a person.
      #
      # Enumerating is also least privilege. The old loop copied every secret
      # visible to the repo, so the org-wide CI credentials (NPM_TOKEN,
      # CLOUDFLARE_API_TOKEN, ADD_TO_PROJECT_TOKEN) ended up in this app's SSM
      # namespace.
      #
      # The list is the secrets the `alia` task definition actually consumes.
      # Adding a new one means adding it here, or it never reaches SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SERVICE_SECRET: ${{ secrets.SERVICE_SECRET }}
          APP_TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # Shared with the `alia-integrations` service, which reads the SAME
          # parameter. That service sends nothing; the API sends this value as
          # `X-Gateway-Secret` and integrations compares it with `verifySecret`.
          # Two parameters holding "the same" secret is one rotation away from a
          # 401 nobody can explain, so there is deliberately only one.
          APP_INTEGRATIONS_SECRET: ${{ secrets.INTEGRATIONS_SECRET }}
          # The Oxy ApplicationCredential Alia presents to mint a service token
          # against the inference edge. NOT a provider credential: `alia` and
          # `relay` are not provider slugs, so `namesProviderCredential` does not
          # refuse these — the gate's predicate is about what a name IS, and
          # these are an Oxy identity, not an upstream account. What does move is
          # the frozen DEPLOYED_SECRETS census, deliberately, with its count.
          APP_ALIA_RELAY_CREDENTIAL_KEY: ${{ secrets.ALIA_RELAY_CREDENTIAL_KEY }}
          APP_ALIA_RELAY_CREDENTIAL_SECRET: ${{ secrets.ALIA_RELAY_CREDENTIAL_SECRET }}
          APP_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          APP_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SHARED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SHARED_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SHARED_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          SHARED_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SHARED_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"
          sync_secret SERVICE_SECRET "$APP_SERVICE_SECRET" "/oxy/$APP/SERVICE_SECRET"
          sync_secret TOKEN_ENCRYPTION_KEY "$APP_TOKEN_ENCRYPTION_KEY" "/oxy/$APP/TOKEN_ENCRYPTION_KEY"
          sync_secret INTEGRATIONS_SECRET "$APP_INTEGRATIONS_SECRET" "/oxy/$APP/INTEGRATIONS_SECRET"
          sync_secret VAPID_PUBLIC_KEY "$APP_VAPID_PUBLIC_KEY" "/oxy/$APP/VAPID_PUBLIC_KEY"
          sync_secret ALIA_RELAY_CREDENTIAL_KEY "$APP_ALIA_RELAY_CREDENTIAL_KEY" "/oxy/$APP/ALIA_RELAY_CREDENTIAL_KEY"
          sync_secret ALIA_RELAY_CREDENTIAL_SECRET "$APP_ALIA_RELAY_CREDENTIAL_SECRET" "/oxy/$APP/ALIA_RELAY_CREDENTIAL_SECRET"
          sync_secret VAPID_PRIVATE_KEY "$APP_VAPID_PRIVATE_KEY" "/oxy/$APP/VAPID_PRIVATE_KEY"
          sync_secret AWS_ACCESS_KEY_ID "$SHARED_AWS_ACCESS_KEY_ID" "/oxy/_shared/AWS_ACCESS_KEY_ID"
          sync_secret AWS_SECRET_ACCESS_KEY "$SHARED_AWS_SECRET_ACCESS_KEY" "/oxy/_shared/AWS_SECRET_ACCESS_KEY"
          sync_secret LIVEKIT_API_KEY "$SHARED_LIVEKIT_API_KEY" "/oxy/_shared/LIVEKIT_API_KEY"
          sync_secret LIVEKIT_API_SECRET "$SHARED_LIVEKIT_API_SECRET" "/oxy/_shared/LIVEKIT_API_SECRET"

          # Valkey lives in the cluster's region; a URL from another region
          # leaves the service silently without a cache, so it is rejected.
          if [ -n "$SHARED_REDIS_URL" ] && [ "$SHARED_REDIS_URL" != "-" ] &&
             [ "$AWS_REGION" = "us-west-2" ] &&
             ! printf '%s' "$SHARED_REDIS_URL" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
            echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
          else
            sync_secret REDIS_URL "$SHARED_REDIS_URL" "/oxy/_shared/REDIS_URL"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: build
        # The tight bound, on the step that hangs. Three stalls on 2026-08-19
        # (`fc613f2d`, `1665503d`, `8b631942`) froze at the same layer, roughly
        # ten seconds in, and emitted nothing further:
        #
        #   #25 [builder 16/18] RUN bun install --filter "@alia/api"
        #
        # Each cleared in about two minutes on a plain re-run, so the work is
        # fine and the build hangs rather than running slowly.
        #
        # 15 minutes is 5.5x the slowest of the 100 successful runs between
        # 2026-08-09 and 2026-08-19 (2m44s; the fastest was 1m49s). There is no
        # layer cache to miss — no --cache-from/--cache-to here, no cache mount
        # in packages/api/Dockerfile, and setup-buildx-action creates a fresh
        # builder per run — so every one of those samples is already a cold
        # build and there is no slower legitimate mode left to protect.
        #
        # No retry, deliberately: re-entering the same stall would double the
        # hold on the concurrency group.
        timeout-minutes: 15
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # Buildx publishes an OCI index so the tag retains provenance and its
          # attestation descriptor. ECS should run the linux/arm64 CHILD
          # manifest, not race the just-published index. The resolver uses
          # registry reads through the authenticated Docker client, waits for
          # visibility with a strict bound, and validates both descriptors
          # before anything reaches ECS.
          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          INDEX_DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image index digest (got: ${INDEX_DIGEST:-<empty>})"
            exit 1
          fi
          RUNTIME_DIGEST="$(
            IMAGE_REPOSITORY="$IMG" \
            INDEX_DIGEST="$INDEX_DIGEST" \
            bash .github/scripts/resolve-ecr-platform-digest.sh
          )"
          echo "index_digest=$INDEX_DIGEST" >>"$GITHUB_OUTPUT"
          echo "digest=$RUNTIME_DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> index $INDEX_DIGEST -> linux/arm64 $RUNTIME_DIGEST"

      # Does this release carry a post-rollout migration at all?
      #
      # Grepped with the pattern `@oxyhq/db` EXPORTS as `POST_PHASE_GREP_PATTERN`,
      # never a retyped copy — `packages/api/src/db/__tests__/deployWorkflow.test.ts`
      # asserts this workflow contains that exact string, so the two cannot drift.
      #
      # The grep is only sound because the migrator separately proves every file
      # carries exactly one well-formed marker. Without that, a typo in a marker
      # would read here as "no post migration" and the drop would be applied by
      # nothing at all — a silent skip rather than a failure.
      #
      # This resolves TRUE today: `0016` is a `post` migration, with `0017` and
      # `0018` `pre` behind it. The comment this replaces said the journal was
      # all `pre` and the step therefore inert, which stopped being true the day
      # 0016 landed and was corrected by nothing — while the deploys that fact
      # governs were failing.
      #
      # It matters most at desiredCount=0, where alia has sat for the whole
      # Postgres cutover: deploy-ecs-image.sh runs this command on the
      # zero-capacity path too, because a `post` migration deferred there is not
      # deferred, it is DEADLOCKED — the ledger is a high-water mark, so the next
      # release's `pre` run is refused behind the unapplied `post` one and that
      # deploy fails at its migration step.
      # Two things run after the rollout, and deploy-ecs-image.sh takes exactly
      # ONE command, so they are chained through the image's own `/bin/sh`
      # (present in `node:*-bookworm-slim`, verified). `&&` is load-bearing:
      # `sh -c 'a && b'` exits non-zero if EITHER fails, so a failed migration
      # neither runs the seeder nor reports success.
      #
      # The seeder runs UNCONDITIONALLY; the migration only when this release
      # carries a post-phase file. That asymmetry is the point — seeding is
      # idempotent (`onConflictDoNothing` throughout), so running it on every
      # release costs nothing, while making it conditional on an unrelated
      # migration marker is how a seeder ends up wired to something that is
      # usually absent.
      #
      # NOT chained into the `pre` migration instead: `pre` runs BEFORE the
      # rollout, against the schema the OLD image is still serving, and a seeder
      # writing rows the new schema expects does not belong there.
      - name: Build the post-rollout command
        id: phases
        run: |
          SEED='node packages/api/dist/scripts/seed.js --target-database=alia'
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/api/drizzle >/dev/null 2>&1; then
            MIGRATE='node packages/api/dist/db/migrate.js --target-database=alia --phase=post'
            echo "this release carries at least one post-rollout migration"
          else
            MIGRATE=''
            echo "no post-rollout migration in this release"
          fi
          if [ -n "$MIGRATE" ]; then CMD="$MIGRATE && $SEED"; else CMD="$SEED"; fi
          # jq builds the JSON array, so quoting inside the command cannot break
          # the string-array contract deploy-ecs-image.sh validates.
          printf 'post_command=%s\n' "$(jq -cn --arg c "$CMD" '["/bin/sh","-c",$c]')" >>"$GITHUB_OUTPUT"

      # Wire the API to the integrations service — the ONLY step that can.
      #
      # `packages/api/src/lib/tools/mcp.ts:48` gates every hosted MCP connector on
      # `INTEGRATIONS_URL && INTEGRATIONS_SECRET`. Neither is on the running
      # revision, so `buildMcpTools` returns an empty tool set and logs nothing;
      # the registry, `POST /mcp/install` and the OAuth flow are all silently
      # inert. (Local MCP is unaffected — that runs over `lib/mcp-relay.ts`.)
      #
      # Terraform cannot deliver either of them to a service that already exists.
      # `modules/app-service/main.tf` carries `ignore_changes = [task_definition]`,
      # so the service never adopts the revision an apply registers, and this
      # script re-renders each revision from `services[0].taskDefinition` — the
      # RUNNING one — so the CI chain never inherits Terraform's either. An entry
      # added there lands in a revision nothing runs, with no error.
      # `docs/runbooks/integrations-service-rollout.md` has the long version.
      #
      # BOTH overrides are conditional, and that is what makes this step safe to
      # merge before anything is provisioned: with no `INTEGRATIONS_SECRET`
      # secret and no `INTEGRATIONS_URL` variable, both are `{}` and this deploy
      # is byte-identical to the ones before it.
      #
      # The secret's override MUST NOT be emitted when the parameter does not
      # exist. A `secrets[]` binding naming an absent SSM parameter does not warn
      # — it fails every task launch with `ResourceInitializationError: unable to
      # pull secrets`, after a green deploy, which is the shape of failure this
      # whole file is written against.
      - name: Stage the integrations service wiring
        id: integrations
        env:
          # Tested for presence only. Never echoed, never written, never
          # interpolated into a command.
          APP_INTEGRATIONS_SECRET: ${{ secrets.INTEGRATIONS_SECRET }}
          # A repo VARIABLE, not a secret: it is a private DNS name, and the
          # `Sync GitHub secrets -> SSM` discipline should not acquire an entry
          # that is not a credential. Absent until an operator decides the
          # integrations service is serving.
          INTEGRATIONS_URL: ${{ vars.INTEGRATIONS_URL }}
        run: |
          secret_overrides='{}'
          env_overrides='{}'

          have_secret=false
          if [ -n "$APP_INTEGRATIONS_SECRET" ] && [ "$APP_INTEGRATIONS_SECRET" != "-" ]; then
            have_secret=true
          fi

          # Refuse the half-armed combination rather than warn about it.
          #
          # A URL with no credential gives the API an endpoint it cannot
          # authenticate to. `mcp.ts` needs both, so nothing would break — it
          # would stay inert while looking configured, and the operator who set
          # the variable would have no way to tell. The condition arises only when
          # somebody deliberately sets the variable, and either fix is one action:
          # create the secret, or delete the variable.
          if [ -n "$INTEGRATIONS_URL" ] && [ "$have_secret" != "true" ]; then
            echo "::error::INTEGRATIONS_URL is set but the INTEGRATIONS_SECRET repo secret is not. The API would hold an endpoint it cannot authenticate to. Create the secret, or unset the variable."
            exit 1
          fi

          if [ "$have_secret" = "true" ]; then
            secret_overrides="$(jq -cn \
              --arg arn "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/INTEGRATIONS_SECRET" \
              '{INTEGRATIONS_SECRET: $arn}')"
            echo "INTEGRATIONS_SECRET will be bound from SSM"
          else
            echo "no INTEGRATIONS_SECRET repo secret; leaving the API's hosted-MCP path unwired"
          fi

          if [ -n "$INTEGRATIONS_URL" ]; then
            # jq builds the JSON, so a value containing a quote cannot break the
            # object deploy-ecs-image.sh validates. An empty value never reaches
            # here, and that script refuses one anyway.
            env_overrides="$(jq -cn --arg url "$INTEGRATIONS_URL" '{INTEGRATIONS_URL: $url}')"
            echo "INTEGRATIONS_URL will be set on the task definition"
          fi

          printf 'secret_overrides=%s\n' "$secret_overrides" >>"$GITHUB_OUTPUT"
          printf 'env_overrides=%s\n' "$env_overrides" >>"$GITHUB_OUTPUT"

      # Point this deployment at Kaana.
      #
      # Merged into the integrations step's outputs rather than replacing them:
      # the two are unrelated wirings and either can be absent, so a step that
      # overwrote the other's object would make the second one to run win
      # silently.
      #
      # This is also the final composition point for the API's REQUIRED public
      # origin. Terraform declares both names, but cannot deliver either to the
      # existing service because its task definition is ignored. They are
      # constants rather than repo variables: unlike INTEGRATIONS_URL they arm
      # no feature, and every production revision must advertise the same public
      # origin for callbacks, user-facing links and service-to-self requests.
      #
      # ## What each variable is
      #
      # `RELAY_BASE_URL` is checked against `KAANA_ALLOWED_ORIGINS` before a
      # request leaves, so a typo is refused here rather than discovered by a
      # request arriving somewhere unexpected. The host still says `relay` and
      # the product is Kaana; renaming it is a DNS change plus an allow-list
      # change on both sides, and it is not this deploy.
      #
      # There is no enable flag. Kaana is the inference provider, and a
      # deployment that has been given an endpoint, a signing key and a
      # principal has said everything there is to say. What is deliberately NOT
      # set here is `ALIA_RELAY_CLIENT_ENABLED`: that declares the cutover DONE,
      # which arms the boot refusal and installs the egress block that makes
      # every direct provider host unreachable — correct the day the in-process
      # tree is deleted, and an outage today, when Kaana serves text and Alia
      # still serves speech, images and realtime voice itself.
      #
      # ## The attribution ids are REAL Oxy ids as of 2026-08-25
      #
      # They used to be placeholders — `app_alia`, `acc_alia_platform`,
      # `cred_alia_edge_2026_08_24` — because Oxy issued none for
      # Alia-as-a-caller. It does now: the `Alia` Application is registered and
      # `internal`, it carries a `service` ApplicationCredential, and it is owned
      # by its own project account. Each value below was read back out of the Oxy
      # database, and the credential was exchanged once against
      # `POST https://api.oxy.so/auth/service-token` — the token came back
      # naming this `applicationId`, this `credentialId` and this
      # `ownerAccountId`, so these three are not merely plausible, they are what
      # Oxy itself puts in the token.
      #
      # Kaana still treats every Oxy id as an opaque string and never joins them
      # against anything, so nothing here DEPENDS on their being real. What
      # changes is that usage Kaana records is now attributable: it books to an
      # account that exists in Oxy's ledger instead of one that does not.
      #
      # THE ACCOUNT ID IS THE ONE TO GET RIGHT. `acc_alia_platform` was replaced
      # by the `alia-production-chat` PROJECT account, minted 2026-08-25, not by
      # the platform owner `oxy` — the two are different accounts and the whole
      # point of the project account is that Alia's spend gets its own line in
      # the cost-centre report rather than being absorbed into the platform's.
      #
      # Before Alia consumes inference THROUGH OXY, that account's billing face
      # has to be provisioned: `account_balances` was empty on 2026-08-25 — zero
      # rows in the whole table. Nothing is spending today, so this is a
      # precondition of the cutover and not a defect; it is restated where the
      # cutover flag is defined (`lib/inference/kaana-cutover.ts`).
      - name: Stage the Kaana edge configuration
        id: kaana
        env:
          INTEGRATIONS_SECRETS: ${{ steps.integrations.outputs.secret_overrides }}
          INTEGRATIONS_ENV: ${{ steps.integrations.outputs.env_overrides }}
        run: |
          required_env="$(jq -cn '{
            API_BASE_URL: "https://api.alia.onl",
            ALIA_API_URL: "https://api.alia.onl"
          }')"

          # The account id is written out, exactly as the integrations step above
          # writes it. `$ACCOUNT_ID` is not set in this workflow, so it expanded
          # to nothing and produced `arn:aws:ssm:us-west-2::parameter/…` — an ARN
          # the script's validator refused, which is why it refused: a `secrets[]`
          # binding naming a parameter that does not exist does not warn, it
          # fails every task launch with `ResourceInitializationError` AFTER a
          # green deploy. The gate turned that into a failed deploy instead.
          # All three are written to SSM by the sync step ABOVE, in this same
          # job, before this render — which is the ordering that makes binding
          # them safe. A `secrets[]` entry naming a parameter that does not
          # exist fails every task launch with `ResourceInitializationError`
          # AFTER a green deploy, so the sync has to have run first. It also
          # means an EMPTY GitHub secret is the hazard rather than a missing
          # one: `sync_secret` skips an empty value with a warning, the
          # parameter never appears, and this binding then points at nothing.
          kaana_secrets="$(jq -cn \
            --arg sign "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/KAANA_EDGE_SIGNING_PRIVATE_KEY" \
            --arg key "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/ALIA_RELAY_CREDENTIAL_KEY" \
            --arg secret "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/ALIA_RELAY_CREDENTIAL_SECRET" \
            '{KAANA_EDGE_SIGNING_PRIVATE_KEY: $sign,
              ALIA_RELAY_CREDENTIAL_KEY: $key,
              ALIA_RELAY_CREDENTIAL_SECRET: $secret}')"
          kaana_env="$(jq -cn '{
            RELAY_BASE_URL: "https://relay.oxy.so",
            KAANA_EDGE_KEY_ID: "alia-edge-2026-08-24",
            ALIA_RELAY_ACCOUNT_ID: "01a0369b-1222-712f-8df6-f8ffeb78ccc2",
            ALIA_RELAY_APPLICATION_ID: "6a2f851751b784a86fd0e934",
            ALIA_RELAY_CREDENTIAL_ID: "01a0371d-509c-7d1f-9fa5-1fb7a6e03174",
            ALIA_RELAY_ENVIRONMENT: "production",
            ALIA_RELAY_INFERENCE_SCOPES: "inference:invoke"
          }')"

          merged_secrets="$(jq -cs '.[0] * .[1]' <(echo "${INTEGRATIONS_SECRETS:-{\}}") <(echo "$kaana_secrets"))"
          merged_env="$(jq -cs '.[0] * .[1] * .[2]' <(echo "${INTEGRATIONS_ENV:-{\}}") <(echo "$kaana_env") <(echo "$required_env"))"

          printf 'secret_overrides=%s\n' "$merged_secrets" >>"$GITHUB_OUTPUT"
          printf 'env_overrides=%s\n' "$merged_env" >>"$GITHUB_OUTPUT"

      # RUN_MIGRATIONS is what turns on machinery deploy-ecs-image.sh has always
      # had and nothing has ever enabled — so until now NOTHING applied Alia's
      # migrations, in any environment. The script runs the migration as a
      # one-shot task on the NEW task definition, before `update-service`, and
      # fails the deploy with the task's CloudWatch logs if it exits non-zero.
      #
      # Running it on the NEW revision is what makes it correct here and is not
      # interchangeable with the "reuse the service's live task definition" shape
      # a sibling repo uses: this workflow pins an immutable digest, so the live
      # revision is the OLD image and migrating with it would apply the previous
      # release's migration set behind a green deploy.
      #
      # `pre` is the script's default and is deliberately not overridden, and no
      # `migration_phase` dispatch input is offered. That input exists elsewhere
      # for a journal whose phases cannot be applied in order — a `pre` file
      # queued behind an unapplied `post` one.
      #
      # This comment used to justify that by saying all 16 entries are `pre`.
      # Both halves were wrong: the journal holds 28 migrations and two carry
      # `post` (0016_jazzy_justin_hammer, 0025_opposite_cyclops). So the state it
      # called impossible is not.
      #
      # What actually keeps the phases together is deploy-ecs-image.sh, on two
      # paths, both checked rather than assumed:
      #   - a non-positive desiredCount aborts before anything is applied
      #     ("must have a positive desiredCount before deployment"), so the
      #     zero-capacity deploy that skips `post` while applying `pre` cannot
      #     start;
      #   - a failing post-deploy reconciliation errors, rolls the service back
      #     and exits 1, so a `post` that did not apply fails the deploy instead
      #     of leaving the gap open.
      #
      # Recount before reasoning from a number here. The previous one went stale
      # without anything failing, which is how it survived.
      #
      # The interlock the migrator requires is the workflow-level `concurrency`
      # group above. `runMigrations` takes no lock — it reads the ledger's high
      # water mark outside its transaction, so two concurrent runners both
      # attempt the same DDL and the loser exits 1 on an already-applied
      # statement. That group, with `cancel-in-progress: false`, is what makes a
      # merge landing mid-deploy wait rather than race.
      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          RUN_MIGRATIONS: 'true'
          MIGRATION_TARGET_DATABASE: ${{ env.APP }}
          # Stated rather than left to the script's default, which now exists
          # only because `packages/integrations` ships a second migrator against
          # a second database. The `post` phase names the same file in the step
          # above; `deployWorkflow.test.ts` asserts the two agree, because two
          # separately-written paths for one fact is exactly how a `pre` and a
          # `post` phase end up migrating different packages.
          MIGRATION_ENTRYPOINT: packages/api/dist/db/migrate.js
          POST_DEPLOY_TASK_COMMAND_JSON: ${{ steps.phases.outputs.post_command }}
          TASK_SECRET_OVERRIDES_JSON: ${{ steps.kaana.outputs.secret_overrides }}
          # Stop injecting a static IAM user's keys.
          #
          # The task definition declares `taskRoleArn: oxy-ecs-task` and ALSO
          # injected these two, and the environment beats the task role in the
          # AWS credential chain — so the declared role had never been used.
          # Measured: the role's S3 policies are identical in actions and buckets
          # to the user's, and it additionally carries
          # `oxy-task-ssm-alia-provider-keys`, which the user lacks. The
          # injection was costing a permission and gaining none, and it is why
          # the provider-key one-shot could not read its own SSM parameter.
          #
          # Safe only because `lib/s3.ts` now omits the `credentials` key when
          # the environment carries no pair, instead of passing an EMPTY one that
          # the SDK signs with. That landed first, deliberately.
          TASK_SECRET_REMOVALS_JSON: '["AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY"]'
          TASK_ENV_OVERRIDES_JSON: ${{ steps.kaana.outputs.env_overrides }}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh
