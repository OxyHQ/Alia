# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute alia (ecs service + ecr repo name) and packages/api/Dockerfile (path).
name: Deploy to AWS

on:
  # After CI passes on a push to main, never alongside it. Until 2026-10 this ran
  # on `push`, in parallel with CI, so a commit whose CI went red still reached
  # production and every merge held two runners building the same image at once.
  # The `scope` job below owns the guards and the path scope `push` used to give:
  # only main's current head is released, and only when something other than
  # docs changed since the last commit this workflow released.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's head on demand, and still only once CI succeeded for it
  # (`deploy-scope.sh gate` checks that, once, and refuses otherwise).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: alia
  CLUSTER: oxy-cluster
  # The commit under release: the one CI tested on `workflow_run`, main's head on
  # a dispatch. Not `github.sha`, which on `workflow_run` is whatever main's head
  # was when CI finished. Not named DEPLOY_SHA: deploy-ecs-image.sh reads that
  # name to arm a head guard script this repository does not carry.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    needs: scope
    # `scope` admits only a commit CI passed on a push to main in this repository,
    # still main's head, with something to release. The ref check stays as well:
    # only the protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.api == 'true'
    # On the JOB, not the workflow, and that placement is the point. Every CI run
    # on main starts a run of this workflow, and they arrive in CI's finishing
    # order, not push order. A workflow-level group would let a run for an OLDER
    # commit queue behind the running release and displace a newer one pending
    # there (GitHub keeps only the most recent pending run per group). Here only
    # a run `scope` has already judged to be main's head ever enters the lane.
    #
    # Serialize production rollouts. Two overlapping runs each register a task
    # definition revision and then call update-service; interleaved, the older
    # image wins and the newer run still reports success. Never cancel in
    # progress: an interrupted run leaves an unmonitored rollout in ECS.
    concurrency:
      group: deploy-alia-backend
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    # The backstop, and deliberately loose — the tight bound is on the build
    # step, which is where the hangs actually happen.
    #
    # Without any bound the job inherits GitHub's 6-hour default, and the
    # `concurrency` group above never cancels in progress, so a hung job holds
    # production rollouts for those six hours. Worse, GitHub keeps only the most
    # recent PENDING run per group, so everything queued behind it is cancelled
    # having never run. Measured 2026-08-19: `fc613f2d` hung 43 min, and
    # `f52a8db6` and `9c3edb79` were both cancelled with ZERO jobs — neither
    # commit was ever built, and their `cancelled` conclusions say nothing about
    # their own content.
    #
    # The number has to sit ABOVE deploy-ecs-image.sh's own ceiling, never
    # below. That script bounds every wait at MAX_WAIT_SECS (1200s), and on this
    # workflow's configuration — RUN_MIGRATIONS plus a POST_DEPLOY_TASK_COMMAND
    # — the longest chain is four sequential ones: the pre-phase migration
    # one-shot, the rollout, the post-deploy reconciliation one-shot, and the
    # rollback a failure of that last one triggers. 4 x 20 = 80 min. Add the
    # 15-minute build bound below and the measured worst case of 2m20s for
    # every other step combined (100 successful runs), and the ceiling is 98.
    #
    # Killing the job inside those 80 minutes is the one genuinely dangerous
    # outcome available here: it strands precisely the unmonitored ECS rollout
    # the concurrency comment above exists to prevent. A `packages/api` test
    # re-derives this arithmetic from the script, so raising MAX_WAIT_SECS
    # without raising this fails rather than silently arming that kill.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets are NOT in GitHub. SSM Parameter Store (/oxy/alia/*,
      # SecureString) is their single source of truth: the task definition reads
      # them at task start, and nothing in this workflow writes one. Setting or
      # rotating a value is `aws ssm put-parameter --overwrite` by its owner
      # (oxy-infra docs/runbooks/46-app-secrets-in-ssm.md), never a repo secret;
      # /oxy/_shared/* belongs to oxy-infra (runbook 45). Until 2026-10-10 a step
      # here copied GitHub repo secrets into SSM on every deploy; that made
      # GitHub the source of truth for production credentials and is gone.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only this main-only
      # job writes the `alia` scope; no pull_request workflow does.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, Deploy Script
      # Tests), so a change that would stop here fails before it can merge.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe alia

      - name: Build and push (linux/arm64)
        id: build
        # The tight bound, on the step that hangs. Three stalls on 2026-08-19
        # (`fc613f2d`, `1665503d`, `8b631942`) froze at the same layer, roughly
        # ten seconds in, and emitted nothing further:
        #
        #   #25 [builder 16/18] RUN bun install --filter "@alia/api"
        #
        # Each cleared in about two minutes on a plain re-run, so the work is
        # fine and the build hangs rather than running slowly.
        #
        # 15 minutes is 5.5x the slowest of the 100 successful runs between
        # 2026-08-09 and 2026-08-19 (2m44s; the fastest was 1m49s). Those runs
        # had no layer cache at all, so every sample is a cold build: the GHA
        # cache below only makes a build faster, and a cache miss or eviction
        # falls back to exactly that measured cold case.
        #
        # No retry, deliberately: re-entering the same stall would double the
        # hold on the concurrency group.
        timeout-minutes: 15
        env:
          COMMIT_TAG: ${{ env.RELEASE_SHA }}
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
          TARGET: ${{ steps.reviewed.outputs.target }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # Buildx publishes an OCI index so the tag retains provenance and its
          # attestation descriptor. ECS should run the linux/arm64 CHILD
          # manifest, not race the just-published index. The resolver uses
          # registry reads through the authenticated Docker client, waits for
          # visibility with a strict bound, and validates both descriptors
          # before anything reaches ECS.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP \
            --cache-to type=gha,scope=$APP,mode=max,ignore-error=true \
            -f "$DOCKERFILE" \
            ${TARGET:+--target "$TARGET"} \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$CONTEXT"

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          INDEX_DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image index digest (got: ${INDEX_DIGEST:-<empty>})"
            exit 1
          fi
          RUNTIME_DIGEST="$(
            IMAGE_REPOSITORY="$IMG" \
            INDEX_DIGEST="$INDEX_DIGEST" \
            bash .github/scripts/resolve-ecr-platform-digest.sh
          )"
          echo "index_digest=$INDEX_DIGEST" >>"$GITHUB_OUTPUT"
          echo "digest=$RUNTIME_DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> index $INDEX_DIGEST -> linux/arm64 $RUNTIME_DIGEST"

      # Does this release carry a post-rollout migration at all?
      #
      # Grepped with the pattern `@oxy.so/db` EXPORTS as `POST_PHASE_GREP_PATTERN`,
      # never a retyped copy — `packages/api/src/db/__tests__/deployWorkflow.test.ts`
      # asserts this workflow contains that exact string, so the two cannot drift.
      #
      # The grep is only sound because the migrator separately proves every file
      # carries exactly one well-formed marker. Without that, a typo in a marker
      # would read here as "no post migration" and the drop would be applied by
      # nothing at all — a silent skip rather than a failure.
      #
      # This resolves TRUE today: `0016` is a `post` migration, with `0017` and
      # `0018` `pre` behind it. The comment this replaces said the journal was
      # all `pre` and the step therefore inert, which stopped being true the day
      # 0016 landed and was corrected by nothing — while the deploys that fact
      # governs were failing.
      #
      # It matters most at desiredCount=0, where alia has sat for the whole
      # Postgres cutover: deploy-ecs-image.sh runs this command on the
      # zero-capacity path too, because a `post` migration deferred there is not
      # deferred, it is DEADLOCKED — the ledger is a high-water mark, so the next
      # release's `pre` run is refused behind the unapplied `post` one and that
      # deploy fails at its migration step.
      # Two things run after the rollout, and deploy-ecs-image.sh takes exactly
      # ONE command, so they are chained through the image's own `/bin/sh`
      # (present in `oven/bun:*-slim`, Debian, as it was in the Node image).
      #
      # `bun`: the runtime packages/api/Dockerfile ships. Both one-shots run on
      # the image this workflow just built, never on an older one, so the
      # command and the image always move together. `&&` is load-bearing:
      # `sh -c 'a && b'` exits non-zero if EITHER fails, so a failed migration
      # neither runs the seeder nor reports success.
      #
      # The seeder runs UNCONDITIONALLY; the migration only when this release
      # carries a post-phase file. That asymmetry is the point — seeding is
      # idempotent (`onConflictDoNothing` throughout), so running it on every
      # release costs nothing, while making it conditional on an unrelated
      # migration marker is how a seeder ends up wired to something that is
      # usually absent.
      #
      # NOT chained into the `pre` migration instead: `pre` runs BEFORE the
      # rollout, against the schema the OLD image is still serving, and a seeder
      # writing rows the new schema expects does not belong there.
      - name: Build the post-rollout command
        id: phases
        run: |
          SEED='bun packages/api/dist/scripts/seed.js --target-database=alia'
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/api/drizzle >/dev/null 2>&1; then
            MIGRATE='bun packages/api/dist/db/migrate.js --target-database=alia --phase=post'
            echo "this release carries at least one post-rollout migration"
          else
            MIGRATE=''
            echo "no post-rollout migration in this release"
          fi
          if [ -n "$MIGRATE" ]; then CMD="$MIGRATE && $SEED"; else CMD="$SEED"; fi
          # Reconcile verified stored sessions only; no task can be minted from an owner id.
          CMD="$CMD && bun packages/api/dist/db/migrate-channel-tasks.js --target-database=alia --apply"
          # jq builds the JSON array, so quoting inside the command cannot break
          # the string-array contract deploy-ecs-image.sh validates.
          printf 'post_command=%s\n' "$(jq -cn --arg c "$CMD" '["/bin/sh","-c",$c]')" >>"$GITHUB_OUTPUT"

      # Own processes authenticate with their registered workload identities.
      - name: Stage the integrations service wiring
        id: integrations
        run: |
          env_overrides="$(jq -cn \
            --arg url "http://integrations.alia.internal.oxy.so:3005" \
            '{INTEGRATIONS_URL: $url}')"

          printf 'env_overrides=%s\n' "$env_overrides" >>"$GITHUB_OUTPUT"

      # Wire Alia only to Oxy's published inference edge. The SDK exchanges the
      # attested workload identity for a service token; Oxy derives account,
      # application, credential and authorised routes from that token. Alia
      # carries no Kaana URL, edge-signing key or self-asserted principal IDs.
      - name: Stage Oxy inference configuration
        id: kaana
        env:
          INTEGRATIONS_ENV: ${{ steps.integrations.outputs.env_overrides }}
        run: |
          # `/oxy/$APP/OXY_SERVICE_API_KEY` and `..._SECRET` are NOT checked here
          # any more, and the omission is the point rather than an oversight.
          #
          # The rendered task definition no longer references either — see
          # `TASK_SECRET_REMOVALS_JSON` in the deploy step below — so a gate on
          # them would be a gate whose output nothing reads, and the first thing
          # it would do is fail a healthy deploy on the day those parameters are
          # retired. Alia's API attests its ECS task role instead (oxy ADR 0026)
          # and `@oxy.so/core` >= 1.6.1 mints from that whenever no pair is set.
          #
          # No SSM parameter is deleted by this change. This is the reference to
          # them going away, which is the half a deploy owns.

          # The agents' computer (OxyHQ/oxy-infra runbook 47). Its instance is
          # found by its Role tag, not pinned here: replacing the instance (a
          # user_data change, the on-demand fallback) changes its id, and a
          # pinned id would leave Alia waking an instance that no longer exists.
          computer_instance_id="$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=alia-computer-host" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ "$(wc -w <<<"$computer_instance_id")" -ne 1 ]; then
            echo "::error::expected exactly one alia-computer-host instance, found: '$computer_instance_id'"
            exit 1
          fi

          required_env="$(jq -cn --arg computer_instance_id "$computer_instance_id" '{
            API_BASE_URL: "https://api.alia.onl",
            ALIA_API_URL: "https://api.alia.onl",
            OXY_API_URL: "https://api.oxy.so",
            ALIA_COMPUTER_HOST_URL: "http://computer.alia.internal.oxy.so:8080",
            ALIA_COMPUTER_HOST_INSTANCE_ID: $computer_instance_id
          }')"

          merged_env="$(jq -cs '.[0] * .[1]' <(echo "${INTEGRATIONS_ENV:-{\}}") <(echo "$required_env"))"

          printf 'env_overrides=%s\n' "$merged_env" >>"$GITHUB_OUTPUT"

      # RUN_MIGRATIONS is what turns on machinery deploy-ecs-image.sh has always
      # had and nothing has ever enabled — so until now NOTHING applied Alia's
      # migrations, in any environment. The script runs the migration as a
      # one-shot task on the NEW task definition, before `update-service`, and
      # fails the deploy with the task's CloudWatch logs if it exits non-zero.
      #
      # Running it on the NEW revision is what makes it correct here and is not
      # interchangeable with the "reuse the service's live task definition" shape
      # a sibling repo uses: this workflow pins an immutable digest, so the live
      # revision is the OLD image and migrating with it would apply the previous
      # release's migration set behind a green deploy.
      #
      # `pre` is the script's default and is deliberately not overridden, and no
      # `migration_phase` dispatch input is offered. That input exists elsewhere
      # for a journal whose phases cannot be applied in order — a `pre` file
      # queued behind an unapplied `post` one.
      #
      # This comment used to justify that by saying all 16 entries are `pre`.
      # Both halves were wrong: the journal holds 28 migrations and two carry
      # `post` (0016_jazzy_justin_hammer, 0025_opposite_cyclops). So the state it
      # called impossible is not.
      #
      # What actually keeps the phases together is deploy-ecs-image.sh, on two
      # paths, both checked rather than assumed:
      #   - a non-positive desiredCount aborts before anything is applied
      #     ("must have a positive desiredCount before deployment"), so the
      #     zero-capacity deploy that skips `post` while applying `pre` cannot
      #     start;
      #   - a failing post-deploy reconciliation errors, rolls the service back
      #     and exits 1, so a `post` that did not apply fails the deploy instead
      #     of leaving the gap open.
      #
      # Recount before reasoning from a number here. The previous one went stale
      # without anything failing, which is how it survived.
      #
      # The interlock the migrator requires is the `deploy` job's `concurrency`
      # group above. `runMigrations` takes no lock — it reads the ledger's high
      # water mark outside its transaction, so two concurrent runners both
      # attempt the same DDL and the loser exits 1 on an already-applied
      # statement. That group, with `cancel-in-progress: false`, is what makes a
      # merge landing mid-deploy wait rather than race.
      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          RUN_MIGRATIONS: 'true'
          MIGRATION_TARGET_DATABASE: ${{ env.APP }}
          # Stated rather than left to the script's default, which now exists
          # only because `packages/integrations` ships a second migrator against
          # a second database. The `post` phase names the same file in the step
          # above; `deployWorkflow.test.ts` asserts the two agree, because two
          # separately-written paths for one fact is exactly how a `pre` and a
          # `post` phase end up migrating different packages.
          MIGRATION_ENTRYPOINT: packages/api/dist/db/migrate.js
          # The runtime packages/api/Dockerfile ships (oven/bun). The script's
          # default is `node`, which packages/integrations still runs on;
          # `dockerfileRuntime.test.ts` holds this line and the Dockerfile together.
          MIGRATION_RUNTIME: bun
          POST_DEPLOY_TASK_COMMAND_JSON: ${{ steps.phases.outputs.post_command }}
          # Own service calls use the registered temporary task-role identity.
          # Remove inherited legacy process, customer-key and static AWS bindings
          # from every new revision; deleting a sync line would retain them.
          # Readiness validates the workload-backed inference path before traffic.
          TASK_SECRET_REMOVALS_JSON: '["SERVICE_SECRET","INTEGRATIONS_SECRET","DISCORD_BOT_SECRET","SLACK_BOT_SECRET","WHATSAPP_BOT_SECRET","WHATSAPP_GATEWAY_SECRET","SIGNAL_BOT_SECRET","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","KAANA_EDGE_SIGNING_PRIVATE_KEY","ALIA_RELAY_CREDENTIAL_KEY","ALIA_RELAY_CREDENTIAL_SECRET","ALIA_KAANA_CREDENTIAL_KEY","ALIA_KAANA_CREDENTIAL_SECRET","OXY_SERVICE_API_KEY","OXY_SERVICE_API_SECRET"]'
          # Remove every legacy plain Relay/direct-Kaana binding inherited from
          # the live task definition. Keeping a removal here is harmless after
          # the first clean revision and prevents a rollback descendant from
          # silently reintroducing the obsolete contract.
          TASK_CONFIGURATION_REMOVALS_JSON: '["RELAY_BASE_URL","ALIA_RELAY_APPLICATION_ID","ALIA_RELAY_ACCOUNT_ID","ALIA_RELAY_CREDENTIAL_ID","ALIA_RELAY_ENVIRONMENT","ALIA_RELAY_INFERENCE_SCOPES","KAANA_EDGE_KEY_ID","ALIA_KAANA_CLIENT_ENABLED","ALIA_KAANA_APPLICATION_ID","ALIA_KAANA_ACCOUNT_ID","ALIA_KAANA_CREDENTIAL_ID","ALIA_KAANA_ENVIRONMENT","ALIA_KAANA_INFERENCE_SCOPES","KAANA_BASE_URL","ALIA_INTERNAL_MCP_PILOT"]'
          TASK_ENV_OVERRIDES_JSON: ${{ steps.kaana.outputs.env_overrides }}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      # The scope job's base for the next release: the last commit this workflow
      # actually rolled out, as an Actions cache key (its content is irrelevant).
      # Only a successful rollout reaches this step, and it runs on main only, so
      # no pull request can move it. Lost or evicted, the next run releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: alia-release-api-${{ env.RELEASE_SHA }}

  # Decides, OUTSIDE the release lane, whether `deploy` runs at all: the trigger
  # guards, main's head, and the path scope. See deploy-scope.sh for why each is
  # needed once the trigger is `workflow_run`. Defined after `deploy` only so
  # that `deploy` stays the first job in the file, which deployWorkflow.test.ts
  # relies on to slice the job's header.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level: no OIDC token here, and `actions: read` (CI's runs for a manual
    # release, the release marker) reaches no other job.
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.api.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
      - name: Release only CI-green main head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # The `paths-ignore` this workflow had on `push`: everything but Markdown
      # and docs/ ships in the API image or its deploy. EXCEPT the Markdown the
      # API reads at runtime: packages/api/prompts/** and packages/api/skills/**
      # are the system prompts and skills, so a change there must release. ERE has
      # no negative lookahead, so the ignore lists the Markdown that does NOT ship
      # (root, other packages, the API's own README and src/) instead of `\.md$`.
      - name: Decide whether anything the API ships changed
        id: api
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh target api exclude '(^docs/|^[^/]+\.md$|^packages/(alia-[^/]+|app|integrations)/.*\.md$|^packages/api/([^/]+\.md|src/.*\.md)$)' alia-release-api-
